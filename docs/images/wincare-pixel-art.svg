<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="ar-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0078d4"/>
    </marker>
    <marker id="ar-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="860" height="320" fill="#0b0f19" rx="14"/>
  <rect x="1" y="1" width="858" height="318" fill="none" stroke="#1e293b" stroke-width="1.5" rx="13"/>

  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.5">
    <line x1="0" y1="40" x2="860" y2="40"/>
    <line x1="0" y1="80" x2="860" y2="80"/>
    <line x1="0" y1="120" x2="860" y2="120"/>
    <line x1="0" y1="160" x2="860" y2="160"/>
    <line x1="0" y1="200" x2="860" y2="200"/>
    <line x1="0" y1="240" x2="860" y2="240"/>
  </g>

  <!-- Left Character: WinCare Kinetic Operator (7px pixel grid) -->
  <g transform="translate(36, 90)">
    <!-- Row 0: Hair top -->
    <rect x="14" y="0" width="28" height="7" fill="#1e293b"/>
    <!-- Row 1: Hair + Tech Visor -->
    <rect x="7" y="7" width="14" height="7" fill="#1e293b"/>
    <rect x="21" y="7" width="21" height="7" fill="#0ea5e9"/>
    <rect x="42" y="7" width="7" height="7" fill="#1e293b"/>
    <!-- Row 2: Face Top -->
    <rect x="7" y="14" width="42" height="7" fill="#ffdab9"/>
    <!-- Row 3: Eyes -->
    <rect x="7" y="21" width="7" height="7" fill="#ffdab9"/>
    <rect x="14" y="21" width="7" height="7" fill="#0f172a"/>
    <rect x="21" y="21" width="14" height="7" fill="#ffdab9"/>
    <rect x="35" y="21" width="7" height="7" fill="#0f172a"/>
    <rect x="42" y="21" width="7" height="7" fill="#ffdab9"/>
    <!-- Row 4: Mouth -->
    <rect x="7" y="28" width="14" height="7" fill="#ffdab9"/>
    <rect x="21" y="28" width="14" height="7" fill="#e8967a"/>
    <rect x="35" y="28" width="14" height="7" fill="#ffdab9"/>
    <!-- Row 5: Body Top + Hands -->
    <rect x="0" y="35" width="7" height="7" fill="#ffdab9"/>
    <rect x="7" y="35" width="42" height="7" fill="#0078d4"/>
    <rect x="49" y="35" width="7" height="7" fill="#ffdab9"/>
    <!-- Row 6: Shirt -->
    <rect x="7" y="42" width="42" height="7" fill="#0284c7"/>
    <!-- Row 7: Pants -->
    <rect x="7" y="49" width="14" height="7" fill="#334155"/>
    <rect x="35" y="49" width="14" height="7" fill="#334155"/>
    <!-- Row 8: Boots -->
    <rect x="7" y="56" width="14" height="7" fill="#0f172a"/>
    <rect x="35" y="56" width="14" height="7" fill="#0f172a"/>
  </g>
  <!-- Operator Label -->
  <text x="64" y="172" text-anchor="middle" font-size="11px" font-weight="bold" fill="#38bdf8">Kinetic UI</text>
  <text x="64" y="186" text-anchor="middle" font-size="9px" fill="#64748b">Operator</text>

  <!-- Right Character: Rust Core Guard (7px pixel grid) -->
  <g transform="translate(766, 90)">
    <!-- Row 0: Helm top -->
    <rect x="14" y="0" width="28" height="7" fill="#b91c1c"/>
    <!-- Row 1: Helm + Badge -->
    <rect x="7" y="7" width="14" height="7" fill="#b91c1c"/>
    <rect x="21" y="7" width="14" height="7" fill="#f59e0b"/>
    <rect x="35" y="7" width="14" height="7" fill="#b91c1c"/>
    <!-- Row 2: Face Top -->
    <rect x="7" y="14" width="42" height="7" fill="#ffdab9"/>
    <!-- Row 3: Eyes -->
    <rect x="7" y="21" width="7" height="7" fill="#ffdab9"/>
    <rect x="14" y="21" width="7" height="7" fill="#0f172a"/>
    <rect x="21" y="21" width="14" height="7" fill="#ffdab9"/>
    <rect x="35" y="21" width="7" height="7" fill="#0f172a"/>
    <rect x="42" y="21" width="7" height="7" fill="#ffdab9"/>
    <!-- Row 4: Mouth -->
    <rect x="7" y="28" width="14" height="7" fill="#ffdab9"/>
    <rect x="21" y="28" width="14" height="7" fill="#e8967a"/>
    <rect x="35" y="28" width="14" height="7" fill="#ffdab9"/>
    <!-- Row 5: Body Top + Guard Shield -->
    <rect x="0" y="35" width="7" height="7" fill="#f59e0b"/>
    <rect x="7" y="35" width="42" height="7" fill="#047857"/>
    <rect x="49" y="35" width="7" height="7" fill="#ffdab9"/>
    <!-- Row 6: Armor Tunic -->
    <rect x="7" y="42" width="42" height="7" fill="#059669"/>
    <!-- Row 7: Pants -->
    <rect x="7" y="49" width="14" height="7" fill="#1e293b"/>
    <rect x="35" y="49" width="14" height="7" fill="#1e293b"/>
    <!-- Row 8: Boots -->
    <rect x="7" y="56" width="14" height="7" fill="#022c22"/>
    <rect x="35" y="56" width="14" height="7" fill="#022c22"/>
  </g>
  <!-- Guard Label -->
  <text x="794" y="172" text-anchor="middle" font-size="11px" font-weight="bold" fill="#34d399">Rust Core</text>
  <text x="794" y="186" text-anchor="middle" font-size="9px" fill="#64748b">Guard ETW</text>

  <!-- Chat Dialogues -->

  <!-- Bubble 1: Left -> Right -->
  <g>
    <rect x="115" y="30" width="310" height="28" rx="8" fill="#0f2744" stroke="#0284c7" stroke-width="1.5"/>
    <polygon points="113,42 103,48 113,47" fill="#0f2744" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="112" y="41" width="3" height="8" fill="#0f2744"/>
    <text x="127" y="48" font-size="12px" font-weight="600" fill="#e0f2fe">🚀 Launching WinCare 4.0 Checkup...</text>
  </g>

  <!-- Arrow 1: Row 1 -> Row 2 -->
  <line x1="432" y1="52" x2="480" y2="84" stroke="#0284c7" stroke-width="2" marker-end="url(#ar-blue)"/>

  <!-- Bubble 2: Right -> Left -->
  <g>
    <rect x="435" y="88" width="315" height="28" rx="8" fill="#063826" stroke="#059669" stroke-width="1.5"/>
    <polygon points="752,100 762,106 752,105" fill="#063826" stroke="#059669" stroke-width="1.5"/>
    <rect x="750" y="99" width="3" height="8" fill="#063826"/>
    <text x="447" y="106" font-size="12px" font-weight="600" fill="#d1fae5">⚡ ETW stream live: 8 pillars nominal</text>
  </g>

  <!-- Arrow 2: Row 2 -> Row 3 -->
  <line x1="430" y1="110" x2="385" y2="142" stroke="#059669" stroke-width="2" marker-end="url(#ar-green)"/>

  <!-- Bubble 3: Left -> Right -->
  <g>
    <rect x="115" y="146" width="310" height="28" rx="8" fill="#0f2744" stroke="#0284c7" stroke-width="1.5"/>
    <polygon points="113,158 103,164 113,163" fill="#0f2744" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="112" y="157" width="3" height="8" fill="#0f2744"/>
    <text x="127" y="164" font-size="12px" font-weight="600" fill="#e0f2fe">🛡️ 1-click execution: Zero stubs confirmed</text>
  </g>

  <!-- Arrow 3: Row 3 -> Row 4 -->
  <line x1="432" y1="168" x2="480" y2="200" stroke="#0284c7" stroke-width="2" marker-end="url(#ar-blue)"/>

  <!-- Bubble 4: Right -> Left -->
  <g>
    <rect x="435" y="204" width="315" height="28" rx="8" fill="#063826" stroke="#059669" stroke-width="1.5"/>
    <polygon points="752,216 762,222 752,221" fill="#063826" stroke="#059669" stroke-width="1.5"/>
    <rect x="750" y="215" width="3" height="8" fill="#063826"/>
    <text x="447" y="222" font-size="12px" font-weight="600" fill="#d1fae5">🔒 All 617 tests passed | CI 100% Green</text>
  </g>

  <!-- Bottom Mission Control Badge -->
  <g transform="translate(190, 268)">
    <rect width="480" height="34" rx="17" fill="#131d31" stroke="#253552" stroke-width="1.2"/>
    <circle cx="24" cy="17" r="5" fill="#10b981"/>
    <text x="38" y="21" font-size="11px" font-weight="700" fill="#94a3b8" letter-spacing="1.5">WINCARE 4.0 KINETIC MISSION CONTROL</text>
    <text x="400" y="21" font-size="10px" font-weight="bold" fill="#38bdf8">• ZERO STUBS</text>
  </g>
</svg>
