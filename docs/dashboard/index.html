<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WinCare Local Dashboard</title>
<meta name="description" content="Offline evidence-neutral WinCare dashboard." />
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#0b1020;color:#f4f7fb;margin:0;padding:32px}
.card{background:#121828;border:1px solid #334155;border-radius:12px;padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.label{color:#94a3b8;font-size:12px;text-transform:uppercase}.value{font-size:22px;margin-top:8px}
.warn{color:#f6c85f}.ok{color:#2dd4a8}
</style>
</head>
<body>
<div class="card">
<h1>WinCare Operations Dashboard</h1>
<p>Offline shell. No external network dependencies. Values below require verified backend evidence.</p>
</div>
<div class="grid">
<div class="card"><div class="label">Telemetry</div><div class="value warn">NOT CONNECTED</div></div>
<div class="card"><div class="label">Security Evidence</div><div class="value warn">WAITING FOR PROVIDER</div></div>
<div class="card"><div class="label">System Health</div><div class="value warn">UNKNOWN</div></div>
<div class="card"><div class="label">Data Source</div><div class="value ok">LOCAL ONLY</div></div>
</div>
</body>
</html>
