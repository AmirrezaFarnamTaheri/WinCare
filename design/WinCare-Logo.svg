<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 1. Background Squircle Tile Gradients -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1824"/>
      <stop offset="50%" stop-color="#080F18"/>
      <stop offset="100%" stop-color="#03060A"/>
    </linearGradient>

    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0.3"/>
    </linearGradient>

    <!-- 2. Ambient Deep Radiance Glow -->
    <radialGradient id="ambientRadiance" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.28"/>
      <stop offset="30%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#0284C7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- 3. Shield Acrylic Backplate -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162A3E" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0D1A27" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#060E16" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="shieldStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0.6"/>
    </linearGradient>

    <!-- 4. "W" Left Chevron (Descending Azure to Ascending Cyan/Mint) -->
    <linearGradient id="wLeftArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="25%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>

    <!-- 4b. "W" Right Chevron (Descending Cyan/Mint to Ascending Azure) -->
    <linearGradient id="wRightArm" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="25%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>

    <!-- Specular Bevel Highlights -->
    <linearGradient id="specularLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="specularRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>

    <!-- 5. Central Diagnostic Diamond Keystone -->
    <linearGradient id="diamondLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
    <linearGradient id="diamondRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- 6. Shadow & Glow Filters -->
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00E5FF" flood-opacity="0.35"/>
    </filter>

    <filter id="diamondGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Background Squircle Tile (Fluent continuous curvature) -->
  <rect x="36" y="36" width="440" height="440" rx="108" ry="108" 
        fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="2.5"/>

  <!-- 2. Ambient Radiance Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#ambientRadiance)"/>

  <!-- 3. Precision Subtle Concentric Reticle (faint watermark) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 10" opacity="0.12"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#00FFA3" stroke-width="1" stroke-dasharray="2 8" opacity="0.10"/>

  <!-- 4. Protective Care Shield Contour -->
  <path d="M 256 90
           C 340 90, 412 114, 412 164
           C 412 284, 340 390, 256 432
           C 172 390, 100 284, 100 164
           C 100 114, 172 90, 256 90 Z"
        fill="url(#shieldFill)"
        stroke="url(#shieldStroke)"
        stroke-width="2.5"/>

  <!-- Shield Inner Precision Bevel -->
  <path d="M 256 106
           C 328 106, 394 126, 394 170
           C 394 274, 328 372, 256 412
           C 184 372, 118 274, 118 170
           C 118 126, 184 106, 256 106 Z"
        fill="none"
        stroke="#1E3E56"
        stroke-width="1.2"
        opacity="0.5"/>

  <!-- 5. The Hero Mark: Sculpted Precision "W" Monogram -->
  <g filter="url(#heroShadow)">

    <!-- Left Wing / Chevron -->
    <!-- Sweeps from top-left (120, 150) down to bottom valley (188, 362), then up to center apex (256, 206) -->
    <path d="M 120 152
             L 164 138
             L 210 318
             L 256 206
             L 256 254
             L 220 350
             C 214 364, 198 372, 184 368
             C 172 364, 164 352, 160 338
             L 120 152 Z"
          fill="url(#wLeftArm)"/>

    <!-- Specular Highlight along Left Outer Ridge -->
    <path d="M 120 152
             L 164 138
             L 156 168
             L 126 178 Z"
          fill="url(#specularLeft)"/>

    <!-- Right Wing / Chevron -->
    <!-- Sweeps from center apex (256, 206) down to bottom valley (324, 362), then up to top-right (392, 152) -->
    <path d="M 392 152
             L 348 138
             L 302 318
             L 256 206
             L 256 254
             L 292 350
             C 298 364, 314 372, 328 368
             C 340 364, 348 352, 352 338
             L 392 152 Z"
          fill="url(#wRightArm)"/>

    <!-- Specular Highlight along Right Outer Ridge -->
    <path d="M 392 152
             L 348 138
             L 356 168
             L 386 178 Z"
          fill="url(#specularRight)"/>

    <!-- 6. Central Precision Diagnostic Diamond Keystone (Care Heartbeat & Vitality Spark) -->
    <g filter="url(#diamondGlow)">
      <!-- Left Facet of Diamond -->
      <polygon points="256,138 232,182 256,226"
               fill="url(#diamondLeft)"/>
      <!-- Right Facet of Diamond -->
      <polygon points="256,138 280,182 256,226"
               fill="url(#diamondRight)"/>
      <!-- Precision Diamond Outline / Bezel -->
      <polygon points="256,138 280,182 256,226 232,182"
               fill="none"
               stroke="#FFFFFF"
               stroke-width="1.8"/>

      <!-- Center Calibration Core Spark -->
      <circle cx="256" cy="182" r="4" fill="#FFFFFF"/>
      <circle cx="256" cy="182" r="8" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>
    </g>

    <!-- 7. Lower Shield Anchor Care Chevron (Balanced Health Beacon) -->
    <polygon points="256,396 272,374 256,362 240,374"
             fill="#00FFA3"
             opacity="0.95"/>
  </g>
</svg>
