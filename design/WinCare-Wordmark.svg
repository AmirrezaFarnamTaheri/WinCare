<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">WinCare wordmark</title>
  <desc id="desc">Precision instrument bench mark followed by WinCare technical wordmark and native plane descriptor.</desc>
  <defs>
    <!-- Tile Background -->
    <linearGradient id="wmTileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1824"/>
      <stop offset="50%" stop-color="#080F18"/>
      <stop offset="100%" stop-color="#03060A"/>
    </linearGradient>

    <linearGradient id="wmTileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="wmAmbientRadiance" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.28"/>
      <stop offset="30%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#0284C7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Backplate -->
    <linearGradient id="wmShieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162A3E" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0D1A27" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#060E16" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="wmShieldStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0.6"/>
    </linearGradient>

    <!-- W Chevrons -->
    <linearGradient id="wmWLeftArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="25%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>

    <linearGradient id="wmWRightArm" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="25%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>

    <linearGradient id="wmSpecularLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wmSpecularRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>

    <!-- Diamond Keystone -->
    <linearGradient id="wmDiamondLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
    <linearGradient id="wmDiamondRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="wmHeroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00E5FF" flood-opacity="0.35"/>
    </filter>

    <filter id="wmDiamondGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Precision Mark (Scale 0.546875 -> 280x280) -->
  <g transform="translate(20, 20) scale(0.546875)">
    <!-- Squircle Tile -->
    <rect x="36" y="36" width="440" height="440" rx="108" ry="108" 
          fill="url(#wmTileBg)" stroke="url(#wmTileBorder)" stroke-width="3"/>

    <!-- Ambient Glow -->
    <circle cx="256" cy="256" r="180" fill="url(#wmAmbientRadiance)"/>

    <!-- Shield Backing -->
    <path d="M 256 90
             C 340 90, 412 114, 412 164
             C 412 284, 340 390, 256 432
             C 172 390, 100 284, 100 164
             C 100 114, 172 90, 256 90 Z"
          fill="url(#wmShieldFill)"
          stroke="url(#wmShieldStroke)"
          stroke-width="3"/>

    <path d="M 256 106
             C 328 106, 394 126, 394 170
             C 394 274, 328 372, 256 412
             C 184 372, 118 274, 118 170
             C 118 126, 184 106, 256 106 Z"
          fill="none"
          stroke="#1E3E56"
          stroke-width="1.5"
          opacity="0.5"/>

    <!-- Hero W Monogram -->
    <g filter="url(#wmHeroShadow)">
      <!-- Left Wing -->
      <path d="M 120 152
               L 164 138
               L 210 318
               L 256 206
               L 256 254
               L 220 350
               C 214 364, 198 372, 184 368
               C 172 364, 164 352, 160 338
               L 120 152 Z"
            fill="url(#wmWLeftArm)"/>

      <path d="M 120 152
               L 164 138
               L 156 168
               L 126 178 Z"
            fill="url(#wmSpecularLeft)"/>

      <!-- Right Wing -->
      <path d="M 392 152
               L 348 138
               L 302 318
               L 256 206
               L 256 254
               L 292 350
               C 298 364, 314 372, 328 368
               C 340 364, 348 352, 352 338
               L 392 152 Z"
            fill="url(#wmWRightArm)"/>

      <path d="M 392 152
               L 348 138
               L 356 168
               L 386 178 Z"
            fill="url(#wmSpecularRight)"/>

      <!-- Central Diamond Keystone -->
      <g filter="url(#wmDiamondGlow)">
        <polygon points="256,138 232,182 256,226" fill="url(#wmDiamondLeft)"/>
        <polygon points="256,138 280,182 256,226" fill="url(#wmDiamondRight)"/>
        <polygon points="256,138 280,182 256,226 232,182" fill="none" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="256" cy="182" r="4.5" fill="#FFFFFF"/>
      </g>

      <!-- Lower Care Chevron -->
      <polygon points="256,396 272,374 256,362 240,374" fill="#00FFA3" opacity="0.95"/>
    </g>
  </g>

  <!-- Precision Typography Lockup -->
  <text x="330" y="185" fill="#101B24" font-family="'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif" font-size="144" font-weight="800" letter-spacing="-3">WIN<tspan fill="#00FFA3" font-size="120">·</tspan><tspan fill="#008CA3">CARE</tspan></text>
  <text x="335" y="246" fill="#435C6B" font-family="'Cascadia Code', 'Cascadia Mono', Consolas, monospace" font-size="23" font-weight="600" letter-spacing="5">PRECISION SYSTEM BENCH // 64-BIT NATIVE PLANE</text>
</svg>
