name: regenerate-source-index

on:
  push:
    branches:
      - claude/repo-audit-optimization-cobe67

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Regenerate exact source-reference index
        run: python tools/validate_source_references.py . --write --output artifacts/source-reference-refresh.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regenerated-source-reference-index
          path: |
            src/WinCare/Data/SourceReferenceIndex.json
            artifacts/source-reference-refresh.json
          if-no-files-found: error
