name: apply-final-windows-remediation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Apply assertion-guarded final remediation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')

          maintenance_old = '''function ConvertTo-WinCareMaintenanceMap {
              param([Parameter(Mandatory)][object]$Value)
              ConvertTo-WinCareParameterDictionary $Value
          }

          function Get-WinCareMaintenanceRecordHash {
              [CmdletBinding()]
              param([AllowNull()][object]$Record)
              if($null -eq $Record){return 'absent'}
              $map=ConvertTo-WinCareMaintenanceMap $Record
              $null=Test-WinCareMaintenanceRecord -Record $map
              Get-WinCareSha256Text -Text (ConvertTo-WinCareCanonicalJson -InputObject $map -Depth 40)
          }
          '''
          maintenance_new = '''function ConvertTo-WinCareMaintenanceMap {
              param([Parameter(Mandatory)][object]$Value)
              ConvertTo-WinCareParameterDictionary $Value
          }

          function ConvertTo-WinCareCanonicalMaintenanceRecord {
              [CmdletBinding()]
              param([Parameter(Mandatory)][object]$Record)
              $map=ConvertTo-WinCareMaintenanceMap $Record
              $null=Test-WinCareMaintenanceRecord -Record $map
              [ordered]@{
                  SchemaVersion=[int]$map.SchemaVersion
                  Id=[string]$map.Id
                  Name=[string]$map.Name
                  Description=[string]$map.Description
                  StartAt=([datetimeoffset]::Parse([string]$map.StartAt,[Globalization.CultureInfo]::InvariantCulture,[Globalization.DateTimeStyles]::RoundtripKind)).ToUniversalTime().ToString('o')
                  EndAt=([datetimeoffset]::Parse([string]$map.EndAt,[Globalization.CultureInfo]::InvariantCulture,[Globalization.DateTimeStyles]::RoundtripKind)).ToUniversalTime().ToString('o')
                  NoticeAt=([datetimeoffset]::Parse([string]$map.NoticeAt,[Globalization.CultureInfo]::InvariantCulture,[Globalization.DateTimeStyles]::RoundtripKind)).ToUniversalTime().ToString('o')
                  State=[string]$map.State
                  CreatedAt=([datetimeoffset]::Parse([string]$map.CreatedAt,[Globalization.CultureInfo]::InvariantCulture,[Globalization.DateTimeStyles]::RoundtripKind)).ToUniversalTime().ToString('o')
                  UpdatedAt=([datetimeoffset]::Parse([string]$map.UpdatedAt,[Globalization.CultureInfo]::InvariantCulture,[Globalization.DateTimeStyles]::RoundtripKind)).ToUniversalTime().ToString('o')
                  PlaybookId=[string]$map.PlaybookId
                  Tags=@($map.Tags|ForEach-Object{[string]$_})
                  RequiresRestart=[bool]$map.RequiresRestart
                  Result=if($null -eq $map.Result){$null}else{ConvertTo-WinCareCanonicalValue -Value $map.Result}
                  SourceRecords=@($map.SourceRecords|ForEach-Object{[string]$_})
              }
          }

          function Get-WinCareMaintenanceRecordHash {
              [CmdletBinding()]
              param([AllowNull()][object]$Record)
              if($null -eq $Record){return 'absent'}
              $canonical=ConvertTo-WinCareCanonicalMaintenanceRecord -Record $Record
              Get-WinCareSha256Text -Text (ConvertTo-WinCareCanonicalJson -InputObject $canonical -Depth 40)
          }
          '''
          replace_once('src/WinCare/Providers/86-Maintenance.ps1', maintenance_old, maintenance_new)

          replace_once(
              'src/WinCare/Providers/999z-FinalClosure.ps1',
              """        'sourceRecords',
                  'steps') -Context 'playbook'
              if([string]$p.id -notmatch '^[a-z0-9][a-z0-9.-]{2,80}$' -or [string]::IsNullOrWhiteSpace([string]$p.title)){throw 'Playbook identity is invalid.'}
              if([int]$p.minimumBuild -lt 0 -or [int]$p.maximumBuild -lt [int]$p.minimumBuild){throw 'Playbook build range is invalid.'}
              if($p.requiresAdmin -isnot [bool]){throw 'Playbook requiresAdmin must be Boolean.'}
          """,
              """        'sourceRecords',
                  'steps',
                  'SourcePath',
                  'SourceSha256') -Context 'playbook'
              if([string]$p.id -notmatch '^[a-z0-9][a-z0-9.-]{2,80}$' -or [string]::IsNullOrWhiteSpace([string]$p.title)){throw 'Playbook identity is invalid.'}
              if([int]$p.minimumBuild -lt 0 -or [int]$p.maximumBuild -lt [int]$p.minimumBuild){throw 'Playbook build range is invalid.'}
              if($p.requiresAdmin -isnot [bool]){throw 'Playbook requiresAdmin must be Boolean.'}
              $hasSourcePath=$p.ContainsKey('SourcePath');$hasSourceSha256=$p.ContainsKey('SourceSha256')
              if($hasSourcePath -xor $hasSourceSha256){throw 'Playbook source metadata is incomplete.'}
              if($hasSourcePath){
                  if([string]::IsNullOrWhiteSpace([string]$p.SourcePath) -or ([string]$p.SourcePath).Length -gt 32760){throw 'Playbook source path is invalid.'}
                  if([string]$p.SourceSha256 -notmatch '^[a-f0-9]{64}$'){throw 'Playbook source digest is invalid.'}
              }
          """
          )

          replace_once(
              'src/WinCare/Providers/999z-FinalClosure.ps1',
              """    $playbooks=@($document.playbooks|ForEach-Object{
                  $playbook=[pscustomobject]$_
                  $playbook|Add-Member -NotePropertyName SourcePath -NotePropertyValue $path -Force
                  $playbook|Add-Member -NotePropertyName SourceSha256 -NotePropertyValue $sourceSha256 -Force
                  $playbook
              })
              foreach($playbook in $playbooks){$null=Test-WinCarePlaybookDefinition $playbook;if(-not $seen.Add([string]$playbook.Id)){throw 'Duplicate playbook ID.'}}
          """,
              """    $playbooks=@($document.playbooks|ForEach-Object{
                  $playbook=[pscustomobject]$_
                  $null=Test-WinCarePlaybookDefinition $playbook
                  $playbook|Add-Member -NotePropertyName SourcePath -NotePropertyValue $path -Force
                  $playbook|Add-Member -NotePropertyName SourceSha256 -NotePropertyValue $sourceSha256 -Force
                  $playbook
              })
              foreach($playbook in $playbooks){if(-not $seen.Add([string]$playbook.Id)){throw 'Duplicate playbook ID.'}}
          """
          )

          replace_once(
              'tests/Productivity.Contracts.Tests.ps1',
              "$raw=Get-WinCareRemoteConsentStore;$raw.Records[0].ExpiresAt=[datetime]::UtcNow.AddMinutes(-1).ToString('o');$raw.UpdatedAt=[datetime]::UtcNow.ToString('o');$raw.Revision=[long]$raw.Revision+1",
              "$raw=Get-WinCareRemoteConsentStore;$expiredAt=[datetime]::UtcNow.AddMinutes(-1);$raw.Records[0].CreatedAt=$expiredAt.AddMinutes(-30).ToString('o');$raw.Records[0].ExpiresAt=$expiredAt.ToString('o');$raw.UpdatedAt=[datetime]::UtcNow.ToString('o');$raw.Revision=[long]$raw.Revision+1"
          )
          PY
          git checkout HEAD^ -- .github/workflows/ci.yml
          git rm .github/remediation/final-residual.patch.gz.b64
          python tools/validate_source_references.py . --write
      - name: Validate final source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python tools/validate_source.py . --json-output artifacts/source-validation.json
          python tools/validate_action_bindings.py . --output artifacts/action-binding-validation.json
          python tools/validate_test_source_assertions.py . --output artifacts/test-source-validation.json
          python tools/validate_powershell_calls.py . --output artifacts/public-call-bindings.json
          python tools/validate_module_manifest.py . --output artifacts/module-source-manifest.json
          python tools/validate_source_references.py . --output artifacts/source-reference-validation.json
          python tools/audit_stub_inventory.py . --output artifacts/stub-inventory.json
          python tools/validate_maintainability.py . --output artifacts/maintainability-validation.json
          python tools/validate_network_egress.py . --output artifacts/network-egress-validation.json
          python tools/validate_external_processes.py . --output artifacts/external-process-validation.json
          python tools/validate_bounded_io.py . --output artifacts/bounded-io-validation.json
          python tools/validate_read_only_state.py . --output artifacts/read-only-state-validation.json
          python tools/validate_context_menu_catalog.py . --output artifacts/context-menu-validation.json
          python tools/validate_test_fixtures.py . --output artifacts/test-fixture-validation.json
          python tools/validate_gui.py .
          python -m unittest tools.test_release_tools tools.test_maintainability tools.test_security_invariants tools.test_cleaner_preview tools.test_gui tools.test_source_references tools.test_wincare_ps_source -v
      - name: Commit and publish clean remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WinCare CI Remediation'
          git config user.email 'ci-remediation@wincare.invalid'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close final Windows contract failures'
          git push origin "HEAD:${HEAD_REF}"
