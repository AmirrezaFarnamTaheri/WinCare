name: apply-final-runtime-convergence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Apply assertion-guarded source fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')

          replace_once(
              'src/WinCare/Providers/86-Maintenance.ps1',
              """    $map=ConvertTo-WinCareMaintenanceMap $Window;$null=Test-WinCareMaintenanceRecord $map
              $store=Read-WinCareMaintenanceStore
          """,
              """    $map=ConvertTo-WinCareMaintenanceMap $Window
              $null=Test-WinCareMaintenanceRecord $map
              $map=ConvertTo-WinCareCanonicalMaintenanceRecord -Record $map
              $store=Read-WinCareMaintenanceStore
          """
          )

          replace_once(
              'src/WinCare/Providers/86-Maintenance.ps1',
              """    $window=ConvertTo-WinCareMaintenanceMap $Action.Parameters.Window;$null=Test-WinCareMaintenanceRecord $window
              $store=Read-WinCareMaintenanceStore
          """,
              """    $window=ConvertTo-WinCareMaintenanceMap $Action.Parameters.Window
              $null=Test-WinCareMaintenanceRecord $window
              $window=ConvertTo-WinCareCanonicalMaintenanceRecord -Record $window
              $store=Read-WinCareMaintenanceStore
          """
          )

          replace_once(
              'src/WinCare/Providers/86-Maintenance.ps1',
              """            $null=Test-WinCareMaintenanceRecord -Record $map;$afterRecord=$map;$list.Add($map)
          """,
              """            $null=Test-WinCareMaintenanceRecord -Record $map;$afterRecord=ConvertTo-WinCareCanonicalMaintenanceRecord -Record $map;$list.Add($afterRecord)
          """
          )

          replace_once(
              'src/WinCare/Providers/86-Maintenance.ps1',
              """    if($exists){$targetRecord=ConvertTo-WinCareMaintenanceMap $Action.Parameters.Record;$null=Test-WinCareMaintenanceRecord -Record $targetRecord}
          """,
              """    if($exists){
                  $targetRecord=ConvertTo-WinCareMaintenanceMap $Action.Parameters.Record
                  $null=Test-WinCareMaintenanceRecord -Record $targetRecord
                  $targetRecord=ConvertTo-WinCareCanonicalMaintenanceRecord -Record $targetRecord
              }
          """
          )

          replace_once(
              'src/WinCare/Providers/87-Playbooks.ps1',
              """    New-WinCareResult -Success $true -Code 'MaintenancePlaybooksObserved' -Message 'Playbook catalog and scheduler state were observed.' -Data @{Playbooks=@($items);Count=@($items).Count;EvidenceType='PlaybookCatalogAndTaskSchedulerObservation'}
          """,
              """    return @($items)
          """
          )
          PY
          git checkout 6f817c0b17ec1fe275f0151089bb3a2f60df0881 -- .github/workflows/ci.yml
          python tools/validate_source_references.py . --write
      - name: Validate final source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python tools/validate_source.py . --json-output artifacts/source-validation.json
          python tools/validate_action_bindings.py . --output artifacts/action-binding-validation.json
          python tools/validate_test_source_assertions.py . --output artifacts/test-source-validation.json
          python tools/validate_powershell_calls.py . --output artifacts/public-call-bindings.json
          python tools/validate_module_manifest.py . --output artifacts/module-source-manifest.json
          python tools/validate_source_references.py . --output artifacts/source-reference-validation.json
          python tools/audit_stub_inventory.py . --output artifacts/stub-inventory.json
          python tools/validate_maintainability.py . --output artifacts/maintainability-validation.json
          python tools/validate_network_egress.py . --output artifacts/network-egress-validation.json
          python tools/validate_external_processes.py . --output artifacts/external-process-validation.json
          python tools/validate_bounded_io.py . --output artifacts/bounded-io-validation.json
          python tools/validate_read_only_state.py . --output artifacts/read-only-state-validation.json
          python tools/validate_context_menu_catalog.py . --output artifacts/context-menu-validation.json
          python tools/validate_test_fixtures.py . --output artifacts/test-fixture-validation.json
          python tools/validate_gui.py .
          python -m unittest tools.test_release_tools tools.test_maintainability tools.test_security_invariants tools.test_cleaner_preview tools.test_gui tools.test_source_references tools.test_wincare_ps_source -v
      - name: Commit and publish clean source fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git config user.name 'WinCare CI Remediation'
          git config user.email 'ci-remediation@wincare.invalid'
          git add -A
          git diff --cached --check
          git commit -m 'fix: canonicalize maintenance storage and enumerate playbooks'
          git push origin "HEAD:${HEAD_REF}"
