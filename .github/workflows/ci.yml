name: apply-residual-remediation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Apply and clean residual remediation
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/remediation/residual.patch.gz.b64 | gzip -d > /tmp/wincare-residual.patch
          git apply --check /tmp/wincare-residual.patch
          git apply /tmp/wincare-residual.patch
          git checkout HEAD^ -- .github/workflows/ci.yml
          git rm .github/remediation/residual.patch.gz.b64 .github/workflows/apply-residual-remediation.yml
          python tools/validate_source_references.py . --write
      - name: Validate remediated tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python tools/validate_source.py . --json-output artifacts/source-validation.json
          python tools/validate_action_bindings.py . --output artifacts/action-binding-validation.json
          python tools/validate_test_source_assertions.py . --output artifacts/test-source-validation.json
          python tools/validate_powershell_calls.py . --output artifacts/public-call-bindings.json
          python tools/validate_module_manifest.py . --output artifacts/module-source-manifest.json
          python tools/validate_source_references.py . --output artifacts/source-reference-validation.json
          python tools/audit_stub_inventory.py . --output artifacts/stub-inventory.json
          python tools/validate_maintainability.py . --output artifacts/maintainability-validation.json
          python tools/validate_network_egress.py . --output artifacts/network-egress-validation.json
          python tools/validate_external_processes.py . --output artifacts/external-process-validation.json
          python tools/validate_bounded_io.py . --output artifacts/bounded-io-validation.json
          python tools/validate_read_only_state.py . --output artifacts/read-only-state-validation.json
          python tools/validate_context_menu_catalog.py . --output artifacts/context-menu-validation.json
          python tools/validate_test_fixtures.py . --output artifacts/test-fixture-validation.json
          python tools/validate_gui.py .
          python -m unittest tools.test_release_tools tools.test_maintainability tools.test_security_invariants tools.test_cleaner_preview tools.test_gui tools.test_source_references tools.test_wincare_ps_source -v
          python tools/build_release.py . --output-directory artifacts/release
          VERSION=$(python -c "import re,pathlib; print(re.search(r\"ModuleVersion\\s*=\\s*'([^']+)'\", pathlib.Path('src/WinCare/WinCare.psd1').read_text()).group(1))")
          python tools/verify_release.py "artifacts/release/WinCare-$VERSION.zip" --output artifacts/archive-validation.json
      - name: Commit clean remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WinCare CI Remediation'
          git config user.email 'ci-remediation@wincare.invalid'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close residual Windows validation failures'
          git push origin "HEAD:${HEAD_REF}"
