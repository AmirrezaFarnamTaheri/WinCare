name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Cross-file source validation
        run: python tools/validate_source.py . --json-output artifacts/source-validation.json
      - name: Action contract and dispatcher validation
        run: python tools/validate_action_bindings.py . --output artifacts/action-binding-validation.json
      - name: Test-to-source assertion validation
        run: python tools/validate_test_source_assertions.py . --output artifacts/test-source-validation.json
      - name: Public entry point and UI call validation
        run: python tools/validate_powershell_calls.py . --output artifacts/public-call-bindings.json
      - name: Closed module source manifest validation
        run: python tools/validate_module_manifest.py . --output artifacts/module-source-manifest.json
      - name: Current source-reference validation
        run: python tools/validate_source_references.py . --output artifacts/source-reference-validation.json
      - name: Anti-stub and synthetic-success validation
        run: python tools/audit_stub_inventory.py . --output artifacts/stub-inventory.json
      - name: Maintainability and formatting ratchet
        run: python tools/validate_maintainability.py . --output artifacts/maintainability-validation.json
      - name: Silent network egress validation
        run: python tools/validate_network_egress.py . --output artifacts/network-egress-validation.json
      - name: External process boundary validation
        run: python tools/validate_external_processes.py . --output artifacts/external-process-validation.json
      - name: Bounded runtime I/O validation
        run: python tools/validate_bounded_io.py . --output artifacts/bounded-io-validation.json
      - name: Read-only state validation
        run: python tools/validate_read_only_state.py . --output artifacts/read-only-state-validation.json
      - name: Context-menu command safety validation
        run: python tools/validate_context_menu_catalog.py . --output artifacts/context-menu-validation.json
      - name: Test fixture integrity validation
        run: python tools/validate_test_fixtures.py . --output artifacts/test-fixture-validation.json
      - name: Release, security, GUI, and maintainability tooling tests
        run: python -m unittest tools.test_release_tools tools.test_maintainability tools.test_security_invariants tools.test_cleaner_preview tools.test_gui tools.test_source_references -v
      - name: Deterministic development package
        run: |
          mkdir -p artifacts
          python tools/build_release.py . --output-directory artifacts
          VERSION=$(python -c "import re,pathlib; print(re.search(r\"ModuleVersion\\s*=\\s*'([^']+)'\", pathlib.Path('src/WinCare/WinCare.psd1').read_text()).group(1))")
          python tools/verify_release.py "artifacts/WinCare-$VERSION.zip" --output artifacts/archive-validation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-and-release
          path: artifacts/*
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json
      - name: Verify PowerShell requirement
        shell: pwsh
        run: |
          $current=$PSVersionTable.PSVersion
          if ($current.Major -ne 7 -or $current.Minor -lt 2) { throw "PowerShell 7.2+ is required; found $current" }
      - name: Install validation modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.5.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Scope CurrentUser -Force
      - name: Static, Pester, module, native, and release gates
        shell: pwsh
        run: ./tools/Invoke-WindowsValidation.ps1 -OutputDirectory ./artifacts/windows-validation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-validation-${{ matrix.os }}
          path: artifacts/windows-validation/**
          if-no-files-found: warn
