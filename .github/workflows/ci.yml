name: diagnose-maintenance-persistence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compare planned and persisted maintenance records
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Import-Module ./src/WinCare/WinCare.psd1 -Force -DisableNameChecking -WarningAction SilentlyContinue
          $root=Join-Path $env:RUNNER_TEMP ('WinCare-maintenance-diagnostic-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path (Join-Path $root 'Maintenance') -Force|Out-Null
          & (Get-Module WinCare) {
            param($root)
            $script:WinCareState=@{
              Config=Get-WinCareDefaultConfig
              Policy=Get-WinCareDefaultPolicy
              Root=$root
              SessionId='0123456789abcdef0123456789abcdef'
              IsAdmin=$false
              Capabilities=@{}
              ActionContracts=$null
            }
            $start=[datetimeoffset]::Now.AddHours(1)
            $record=New-WinCareMaintenanceWindowRecord -Name 'CI' -StartAt $start -EndAt $start.AddHours(1) -Tags @('ci')
            $plan=New-WinCareMaintenanceUpsertPlan -Window $record
            $window=ConvertTo-WinCareMaintenanceMap $plan.Actions[0].Parameters.Window
            $window=ConvertTo-WinCareCanonicalMaintenanceRecord -Record $window
            $store=Read-WinCareMaintenanceStore
            $items=[Collections.Generic.List[object]]::new()
            $items.Add($window)
            $newStore=[ordered]@{SchemaVersion=1;Revision=1;Windows=@($items)}
            Write-WinCareMaintenanceStore -Store $newStore
            $savedStore=Read-WinCareMaintenanceStore
            $saved=@(Get-WinCareMaintenanceRecordFromStore -Store $savedStore -Id ([string]$window.Id))[0]
            $expected=ConvertTo-WinCareCanonicalMaintenanceRecord -Record $window
            $actual=ConvertTo-WinCareCanonicalMaintenanceRecord -Record $saved
            Write-Host ('EXPECTED_HASH='+(Get-WinCareMaintenanceRecordHash -Record $expected))
            Write-Host ('ACTUAL_HASH='+(Get-WinCareMaintenanceRecordHash -Record $actual))
            Write-Host ('EXPECTED_JSON='+(ConvertTo-WinCareCanonicalJson -InputObject $expected -Depth 40))
            Write-Host ('ACTUAL_JSON='+(ConvertTo-WinCareCanonicalJson -InputObject $actual -Depth 40))
            foreach($key in $expected.Keys){
              $left=$expected[$key]
              $right=$actual[$key]
              $leftJson=$left|ConvertTo-Json -Compress -Depth 20
              $rightJson=$right|ConvertTo-Json -Compress -Depth 20
              $leftType=if($null -eq $left){'<null>'}else{$left.GetType().FullName}
              $rightType=if($null -eq $right){'<null>'}else{$right.GetType().FullName}
              if($leftJson -cne $rightJson -or $leftType -ne $rightType){
                Write-Host ("DELTA[$key] expectedType=$leftType actualType=$rightType expected=$leftJson actual=$rightJson")
              }
            }
            if((Get-WinCareMaintenanceRecordHash -Record $expected) -eq (Get-WinCareMaintenanceRecordHash -Record $actual)){
              throw 'Diagnostic unexpectedly found no hash difference.'
            }
          } $root
