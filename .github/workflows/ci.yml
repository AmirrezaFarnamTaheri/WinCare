name: apply-host-string-overload-fix

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-host-string-overload-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Correct and verify host string overloads
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact host overload correction
        id: patch
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/host-fix
          exec > >(tee artifacts/host-fix/apply.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/WinCare/Standalone/WinCare.Host.cs')
          text=path.read_text(encoding='utf-8')
          replacements={
              "entry.FullName.EndsWith('/', StringComparison.Ordinal)":"entry.FullName.EndsWith(\"/\", StringComparison.Ordinal)",
              "value.StartsWith('/', StringComparison.Ordinal)":"value.StartsWith(\"/\", StringComparison.Ordinal)",
          }
          for old,new in replacements.items():
              count=text.count(old)
              print(f'[host-fix] source={old!r} matches={count}')
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, found {count}')
              text=text.replace(old,new)
          path.write_text(text,encoding='utf-8')
          for old,new in replacements.items():
              if old in text or text.count(new) != 1:
                  raise SystemExit(f'postcondition failed for {new!r}')
          print('[host-fix] exact replacements verified')
          PY
          git diff --check
          git diff -- src/WinCare/Standalone/WinCare.Host.cs | tee artifacts/host-fix/host.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/WinCare/Standalone/WinCare.Host.cs
          git commit -m 'fix standalone host string comparison overloads'
          commit=$(git rev-parse HEAD)
          echo "source_commit=$commit" >> "$GITHUB_OUTPUT"
          [[ -n "$TARGET_BRANCH" ]] || { echo 'TARGET_BRANCH is empty.' >&2; exit 1; }
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "[host-fix] pushed branch=${TARGET_BRANCH} commit=${commit}"
      - name: Publish host-fix diagnosis
        if: always()
        shell: bash
        run: |
          {
            echo '## Standalone host overload correction'
            echo
            echo "- Outcome: **${{ steps.patch.outcome }}**"
            echo "- Trigger commit: \`${GITHUB_SHA}\`"
            echo "- Source commit: \`${{ steps.patch.outputs.source_commit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ '${{ steps.patch.outcome }}' != 'success' && -f artifacts/host-fix/apply.log ]]; then
            tail -n 200 artifacts/host-fix/apply.log
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: host-string-overload-fix-diagnostics
          path: artifacts/host-fix/**
          if-no-files-found: error
          retention-days: 14
