name: Publish validated release

on:
  workflow_run:
    workflows: ["Native WinUI"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c "import xml.etree.ElementTree as ET; root = ET.parse('Directory.Build.props').getroot(); prefix = root.findtext('.//VersionPrefix'); suffix = root.findtext('.//VersionSuffix', ''); print(f'{prefix}-{suffix}' if suffix else prefix)")
          RELEASE_TAG="v${VERSION}"
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS="--prerelease"
            FINALIZE_MODE="rc"
          else
            RELEASE_FLAGS="--latest"
            FINALIZE_MODE="production"
          fi
          {
            echo "PRODUCT_VERSION=$VERSION"
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "RELEASE_FLAGS=$RELEASE_FLAGS"
            echo "FINALIZE_MODE=$FINALIZE_MODE"
          } >> "$GITHUB_ENV"

      - name: Download validated packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/downloads
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'package-*' \
            --dir artifacts/downloads
          test -n "$(find artifacts/downloads -type f -print -quit)"

      - name: Finalize release source
        shell: bash
        run: >-
          python tools/finalize_native_release.py
          --output release_assets
          --version "$PRODUCT_VERSION"
          --mode "$FINALIZE_MODE"

      - name: Stage packaged release assets
        shell: bash
        run: >-
          python tools/stage_release_assets.py
          --downloads artifacts/downloads
          --output release_assets
          --version "$RELEASE_TAG"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
            if [[ "$TAG_SHA" != "$SOURCE_SHA" ]]; then
              echo "Release $RELEASE_TAG already points to $TAG_SHA, but the validated source is $SOURCE_SHA." >&2
              echo "Bump Directory.Build.props before publishing a new release." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release_assets/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release_assets/* \
              --title "WinCare $RELEASE_TAG" \
              --generate-notes \
              $RELEASE_FLAGS \
              --target "$SOURCE_SHA" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Verify release visibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,isDraft,isPrerelease,targetCommitish \
            --jq 'select(.isDraft == false) | {url, tagName, isPrerelease, targetCommitish}'
