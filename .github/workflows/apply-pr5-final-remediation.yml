name: Apply observable artifact-clean PR 5 remediation

on:
  push:
    branches:
      - agent/documentation-overhaul
    paths:
      - .github/workflows/apply-pr5-final-remediation.yml

permissions:
  contents: write

concurrency:
  group: win-care-pr5-final-remediation
  cancel-in-progress: true

jobs:
  remediate-and-prove:
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          check-latest: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 8.0.416
          cache: false

      - name: Materialize, validate, and publish the atomic candidate
        run: |
          & .\.wincare-finalize\pr5-run.ps1 -Root $PWD

      - name: Upload complete remediation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr5-remediation-${{ github.run_id }}
          path: ${{ runner.temp }}/artifacts/windows-validation
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
