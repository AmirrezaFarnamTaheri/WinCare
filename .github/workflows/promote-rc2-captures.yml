name: Promote WinCare RC2 captures

# Temporary one-shot release preparation. Removed after the verified captures
# have been committed back to the PR branch and before merging.
on:
  push:
    branches: [fix/dedup-hardlink-safety-20261011]

permissions:
  contents: write
  actions: read

jobs:
  promote:
    if: github.repository == 'AmirrezaFarnamTaheri/WinCare'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify source run and download its real Windows captures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_RUN: '38175951432'
          CAPTURE_SHA: 'b614fc23f9d866c948e120d1c0c78c3f5b758776'
        run: |
          set -euo pipefail
          run_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN" --jq '.head_sha')"
          run_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN" --jq '.conclusion')"
          if [[ "$run_sha" != "$CAPTURE_SHA" || "$run_conclusion" != "success" ]]; then
            echo "Refusing to promote a run that did not fully pass at the expected source SHA." >&2
            exit 1
          fi
          # Pull-request jobs build GitHub's synthetic merge commit. The
          # release branch is based on master, so prove the synthetic merge's
          # source tree equals the branch tree before attributing the capture
          # to the reachable PR head. Never rewrite provenance without this.
          git fetch --no-tags origin master
          git merge-base --is-ancestor origin/master "$CAPTURE_SHA"
          merge_tree="$(git merge-tree --write-tree origin/master "$CAPTURE_SHA")"
          source_tree="$(git rev-parse "${CAPTURE_SHA}^{tree}")"
          if [[ "$merge_tree" != "$source_tree" ]] ||
             [[ -n "$(git diff --name-only "$CAPTURE_SHA"..HEAD -- src/ tools/capture_screenshots.py)" ]]; then
            echo "The verified PR merge is not source-identical to the release branch." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/rc2-captures"
          gh run download "$CAPTURE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name runtime-capture-x64 --dir "$RUNNER_TEMP/rc2-captures"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "rc2-captures"
          meta = json.loads((root / "images/runtime-captures.json").read_text(encoding="utf-8"))
          expected = os.environ["CAPTURE_SHA"]
          for filename, route in (("runtime-dashboard.png", "home"), ("runtime-checkup.png", "checkup")):
              image = root / "images" / filename
              info = meta["images"][filename]
              assert info["route"] == route and info["source"] == "portable"
              assert info["architecture"] == "x64" and len(info["commit"]) in (7, 40) and all(ch in "0123456789abcdef" for ch in info["commit"].lower())
              assert image.read_bytes().startswith(b"\x89PNG\r\n\x1a\n") and image.stat().st_size > 10000
          assert (root / "Screenshots.md").is_file()
          # Preserve the short synthetic-merge SHA as a separate audit field.
          # The comparison above established identical source trees; use the
          # reachable source commit as the freshness reference.
          for info in meta["images"].values():
              info["capture_checkout_commit"] = info["commit"]
              info["commit"] = expected[:7]
          (root / "images/runtime-captures.json").write_text(
              json.dumps(meta, indent=2), encoding="utf-8")
          PY
          cp "$RUNNER_TEMP/rc2-captures/images/runtime-dashboard.png" docs/images/
          cp "$RUNNER_TEMP/rc2-captures/images/runtime-checkup.png" docs/images/
          cp "$RUNNER_TEMP/rc2-captures/images/runtime-captures.json" docs/images/
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tools").resolve()))
          import capture_screenshots as captures
          captures.write_screenshots_doc(captures.load_runtime_manifest())
          PY
          python tools/capture_screenshots.py --verify-only
          python tools/capture_screenshots.py --check-freshness
      - name: Commit documented, verified capture bytes to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/runtime-dashboard.png docs/images/runtime-checkup.png \
            docs/images/runtime-captures.json docs/Screenshots.md
          if git diff --cached --quiet; then
            echo "The reviewed runtime captures are already committed."
            exit 0
          fi
          git commit -m "docs(release): promote verified WinCare rc2 runtime captures"
          git push origin "HEAD:refs/heads/fix/dedup-hardlink-safety-20261011"
