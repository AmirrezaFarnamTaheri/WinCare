name: Bootstrap Portable NuGet Lockfiles

on:
  push:
    branches: [arena/01a06cc8-wincare]

permissions:
  contents: read

jobs:
  lockfiles:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - platform: x64
            runtime: win-x64
          - platform: ARM64
            runtime: win-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@4713b0c4d9a8f216d2513cf805d020337de2da40 # pinned upstream commit
        with:
          dotnet-version: "8.0.416"
          global-json-file: global.json
      - name: Inspect portable restore properties
        shell: pwsh
        run: >-
          dotnet msbuild src/WinCare.App/WinCare.App.csproj
          -p:Configuration=Release
          -p:Platform=${{ matrix.platform }}
          -p:RuntimeIdentifier=${{ matrix.runtime }}
          -p:WindowsPackageType=None
          -getProperty:PortablePublish
          -getProperty:NuGetLockFilePath
          -getProperty:RestorePackagesWithLockFile
          -getProperty:RestoreLockedMode
      - name: Generate portable publish lock graph
        shell: pwsh
        run: >-
          dotnet restore src/WinCare.App/WinCare.App.csproj
          -p:Configuration=Release
          -p:Platform=${{ matrix.platform }}
          -r ${{ matrix.runtime }}
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:SelfContained=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:RestoreLockedMode=false
      - name: Inspect generated lockfiles
        shell: pwsh
        run: |
          Write-Output 'Tracked/generated lockfiles:'
          Get-ChildItem . -Recurse -Filter '*lock.json' -File |
            Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' } |
            Sort-Object FullName |
            ForEach-Object { Write-Output $_.FullName }
          Write-Output 'Git status:'
          git status --short
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-lock-debug-${{ matrix.runtime }}
          path: "src/**/*lock.json"
          if-no-files-found: error
          retention-days: 1
