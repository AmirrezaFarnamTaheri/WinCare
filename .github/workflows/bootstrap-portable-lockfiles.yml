name: Apply Integrity Fixes

on:
  push:
    branches: [arena/01a06cc8-wincare]

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: arena/01a06cc8-wincare
      - name: Apply exact integrity patches
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: exact source contract changed")
              p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          plugin = "src/WinCare.Infrastructure/Plugins/PluginInstallerService.cs"
          replace_once(plugin,
              "        bool oldPluginBackedUp = false;\n        bool newPluginPromoted = false;\n",
              "        bool oldPluginBackedUp = false;\n        bool newPluginPromoted = false;\n        bool preserveAdmissionBackup = false;\n",
              "rollback-state")
          replace_once(plugin,
              "        catch\n        {\n            if (newPluginPromoted && Directory.Exists(finalTargetDir))\n",
              "        catch (Exception installException)\n        {\n            Exception? admissionRestoreException = null;\n\n            if (newPluginPromoted && Directory.Exists(finalTargetDir))\n",
              "rollback-catch")
          replace_once(plugin,
              "            // The existing admission record is not overwritten until the final commit move.\n            // Restore from the backup defensively if a platform-specific overwrite partially\n            // changed it before throwing.\n            if (admissionBackupPath != null && File.Exists(admissionBackupPath))\n            {\n                try { File.Copy(admissionBackupPath, admissionPath, overwrite: true); } catch { }\n            }\n",
              "            // The existing admission record is not overwritten until the final commit move.\n            // Restore from the backup defensively if a platform-specific overwrite partially\n            // changed it before throwing. A failed trust-record rollback is security-significant:\n            // retain the backup and surface both failures instead of deleting known-good state.\n            if (admissionBackupPath != null && File.Exists(admissionBackupPath))\n            {\n                try\n                {\n                    File.Copy(admissionBackupPath, admissionPath, overwrite: true);\n                }\n                catch (Exception ex) when (ex is IOException or UnauthorizedAccessException)\n                {\n                    preserveAdmissionBackup = true;\n                    admissionRestoreException = ex;\n                }\n            }\n",
              "admission-restore")
          replace_once(plugin,
              "            else if (!oldPluginBackedUp && File.Exists(admissionPath) && newPluginPromoted)\n            {\n                TryDeleteFile(admissionPath);\n            }\n\n            throw;\n",
              "            else if (!oldPluginBackedUp && File.Exists(admissionPath) && newPluginPromoted)\n            {\n                TryDeleteFile(admissionPath);\n            }\n\n            if (admissionRestoreException != null)\n            {\n                throw new InvalidOperationException(\n                    \"Plugin install failed and the previous trust record could not be restored automatically. \" +\n                    \"A recovery backup was preserved in the plugin staging backup directory.\",\n                    new AggregateException(installException, admissionRestoreException));\n            }\n\n            throw;\n",
              "admission-escalation")
          replace_once(plugin,
              "            if (admissionBackupPath != null && File.Exists(admissionBackupPath))\n            {\n                TryDeleteFile(admissionBackupPath);\n            }\n        }\n    }\n\n    /// <summary>\n    /// Acquires an exclusive, cross-process lock for mutations to a single plugin.\n",
              "            // Preserve the last known-good trust record if rollback itself failed.\n            if (!preserveAdmissionBackup && admissionBackupPath != null && File.Exists(admissionBackupPath))\n            {\n                TryDeleteFile(admissionBackupPath);\n            }\n        }\n    }\n\n    /// <summary>\n    /// Acquires an exclusive, cross-process lock for mutations to a single plugin.\n",
              "admission-cleanup")

          finalizer = "tools/finalize_native_release.py"
          replace_once(finalizer, '    "LICENSE",\n    "README.md",\n', '    "LICENSE",\n    "NuGet.Config",\n    "README.md",\n', "nuget-config")
          replace_once(finalizer, '    "tests/WinCare.CommandCatalog.Tests",\n    "tests/native",\n', '    "tests/WinCare.CommandCatalog.Tests",\n    "tests/WinCare.Infrastructure.Tests",\n    "tests/native",\n', "infrastructure-tests")
          replace_once(finalizer, 'NATIVE_WORKFLOW_FILES = (\n    ".github/dependabot.yml",\n', 'NATIVE_WORKFLOW_FILES = (\n    ".github/CODEOWNERS",\n    ".github/dependabot.yml",\n    ".github/pull_request_template.md",\n', "workflow-evidence")
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\patch.py" -Encoding utf8
          python "$env:RUNNER_TEMP\patch.py"
          git diff --check
      - name: Commit integrity fixes
        shell: pwsh
        run: |
          git config user.name "Farnam"
          git config user.email "taheri.farnam@gmail.com"
          git add src/WinCare.Infrastructure/Plugins/PluginInstallerService.cs tools/finalize_native_release.py
          git commit -m "fix: preserve trust rollback and release evidence"
          git push origin HEAD:arena/01a06cc8-wincare
