name: Wire Portable Locked Publish

on:
  push:
    branches: [arena/01a06cc8-wincare]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: arena/01a06cc8-wincare
      - name: Insert portable lock staging before publish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/native-winui.yml')
          text = path.read_text(encoding='utf-8')
          marker = "      - name: Publish single binary executable\n"
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one publish marker, found {text.count(marker)}')

          stage = '''      - name: Stage locked portable dependency graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = '${{ matrix.runtime }}'
          $projects = @('WinCare.App', 'WinCare.Application', 'WinCare.CommandCatalog', 'WinCare.Domain', 'WinCare.Infrastructure')
          foreach ($project in $projects) {
            $directory = Join-Path 'src' $project
            $variant = Join-Path $directory "packages.portable.$runtime.lock.json"
            $active = Join-Path $directory 'packages.lock.json'
            if (-not (Test-Path -LiteralPath $variant)) {
              throw "Portable lockfile '$variant' is missing."
            }
            Copy-Item -LiteralPath $variant -Destination $active -Force
          }
          Write-Output "Staged $($projects.Count) locked dependency graphs for $runtime."
'''
          path.write_text(text.replace(marker, stage + marker, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check
      - name: Commit workflow hardening
        shell: bash
        run: |
          git config user.name "Farnam"
          git config user.email "taheri.farnam@gmail.com"
          git add .github/workflows/native-winui.yml
          git commit -m "ci: lock portable publish dependency graph"
          git push origin HEAD:arena/01a06cc8-wincare
