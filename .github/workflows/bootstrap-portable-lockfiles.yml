name: Generate Portable NuGet Lockfiles

on:
  push:
    branches: [arena/01a06cc8-wincare]

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: arena/01a06cc8-wincare
      - uses: actions/setup-dotnet@4713b0c4d9a8f216d2513cf805d020337de2da40 # pinned upstream commit
        with:
          dotnet-version: "8.0.416"
          global-json-file: global.json
      - name: Generate x64 portable lock graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @('WinCare.App', 'WinCare.Application', 'WinCare.CommandCatalog', 'WinCare.Domain', 'WinCare.Infrastructure')
          dotnet restore src/WinCare.App/WinCare.App.csproj -p:Configuration=Release -p:Platform=x64 -r win-x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:RestoreLockedMode=false
          foreach ($project in $projects) {
            $directory = Join-Path 'src' $project
            Copy-Item -LiteralPath (Join-Path $directory 'packages.lock.json') -Destination (Join-Path $directory 'packages.portable.win-x64.lock.json') -Force
          }
          git checkout -- src/WinCare.App/packages.lock.json src/WinCare.Application/packages.lock.json src/WinCare.CommandCatalog/packages.lock.json src/WinCare.Domain/packages.lock.json src/WinCare.Infrastructure/packages.lock.json
      - name: Generate ARM64 portable lock graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @('WinCare.App', 'WinCare.Application', 'WinCare.CommandCatalog', 'WinCare.Domain', 'WinCare.Infrastructure')
          dotnet restore src/WinCare.App/WinCare.App.csproj -p:Configuration=Release -p:Platform=ARM64 -r win-arm64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:RestoreLockedMode=false
          foreach ($project in $projects) {
            $directory = Join-Path 'src' $project
            Copy-Item -LiteralPath (Join-Path $directory 'packages.lock.json') -Destination (Join-Path $directory 'packages.portable.win-arm64.lock.json') -Force
          }
          git checkout -- src/WinCare.App/packages.lock.json src/WinCare.Application/packages.lock.json src/WinCare.CommandCatalog/packages.lock.json src/WinCare.Domain/packages.lock.json src/WinCare.Infrastructure/packages.lock.json
      - name: Verify and commit portable lock variants
        shell: pwsh
        run: |
          $variants = @(Get-ChildItem src -Recurse -Filter 'packages.portable.*.lock.json' -File)
          if ($variants.Count -ne 10) { throw "Expected exactly 10 portable lock variants, found $($variants.Count)." }
          git diff --check
          git config user.name "Farnam"
          git config user.email "taheri.farnam@gmail.com"
          git add src/*/packages.portable.*.lock.json
          git commit -m "build: lock portable publish dependency graphs"
          git push origin HEAD:arena/01a06cc8-wincare
