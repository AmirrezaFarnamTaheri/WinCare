name: Apply validated WinCare autofix

on:
  push:
    branches:
      - feature/architectural-hardening-and-ui-deslop
    paths:
      - .autofix/**
      - .github/workflows/apply-validated-autofix.yml

permissions:
  contents: write

concurrency:
  group: win-care-validated-autofix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: feature/architectural-hardening-and-ui-deslop
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.1.0
        with:
          python-version: '3.12'
      - name: Decode and validate repair payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .autofix/wincare-fixes.patch.gz.b64 | gzip -dc > /tmp/wincare-fixes.patch
          test "$(wc -c < /tmp/wincare-fixes.patch)" -gt 1000
          sha256sum /tmp/wincare-fixes.patch
          git apply --check /tmp/wincare-fixes.patch
      - name: Apply consolidated repair
        shell: bash
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn /tmp/wincare-fixes.patch
          rm -rf .autofix
          rm -f .github/workflows/apply-validated-autofix.yml
      - name: Verify structural and behavioral gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wincare-verification
          python tools/validate_source.py . --json-output /tmp/wincare-verification/source.json
          python tools/validate_action_bindings.py . --output /tmp/wincare-verification/actions.json
          python tools/validate_powershell_calls.py . --output /tmp/wincare-verification/public-calls.json
          python tools/validate_module_manifest.py . --output /tmp/wincare-verification/module-manifest.json
          python tools/validate_gui.py . --output /tmp/wincare-verification/gui.json
          python -m unittest \
            tools.test_release_tools \
            tools.test_standalone_release \
            tools.test_maintainability \
            tools.test_security_invariants \
            tools.test_cleaner_preview \
            tools.test_gui \
            tools.test_source_references \
            tools.test_wincare_ps_source -v
      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '[autofix] fix: unify PR repairs and clear validation blockers'
          git push origin HEAD:feature/architectural-hardening-and-ui-deslop
