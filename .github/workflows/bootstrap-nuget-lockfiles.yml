name: Bootstrap NuGet Lockfiles

on:
  push:
    branches: [arena/01a06cc8-wincare]

permissions:
  contents: read

jobs:
  lockfiles:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@4713b0c4d9a8f216d2513cf805d020337de2da40 # pinned upstream commit
        with:
          dotnet-version: "8.0.416"
          global-json-file: global.json
      - name: Generate NuGet lockfiles
        shell: pwsh
        run: dotnet restore WinCare.Native.sln -p:Platform=x64
      - name: Verify generated lockfiles exist
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Recurse -Filter packages.lock.json -File)
          if ($files.Count -ne 8) { throw "Expected 8 NuGet lockfiles, found $($files.Count)." }
          $files | ForEach-Object { Write-Output $_.FullName }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-lockfiles
          path: "**/packages.lock.json"
          if-no-files-found: error
          retention-days: 1
