name: apply release invariant fix

on:
  push:
    branches:
      - fix/release-governance-rest-invariant
    paths:
      - .github/workflows/apply-release-invariant-fix.yml
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.head_ref == 'fix/release-governance-rest-invariant'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/release-governance-rest-invariant
      - name: Replace obsolete release-governance assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/test_security_invariants.py')
          text = path.read_text(encoding='utf-8')
          old = '''        self.assertNotIn("SkipPublisherCheck", workflows)
                  self.assertNotIn("--clobber", release)
                  self.assertIn("gh release view $tag", release)
                  self.assertIn("promotion-manifest.json", release)
                  self.assertIn("windows-validation-report.json", release)
                  self.assertIn("@('--target',$env:SOURCE_COMMIT)", release)
          '''
          new = '''        self.assertNotIn("SkipPublisherCheck", workflows)
                  self.assertNotIn("--clobber", release)
                  self.assertNotIn("gh release view $tag", release)
                  self.assertIn("https://api.github.com/repos/$env:GH_REPO/releases/tags/$encodedTag", release)
                  self.assertIn('Authorization="Bearer $env:GH_TOKEN"', release)
                  self.assertIn("-SkipHttpErrorCheck", release)
                  self.assertIn("$statusCode=[int]$response.StatusCode", release)
                  self.assertIn("if($statusCode -eq 200)", release)
                  self.assertIn("elseif($statusCode -eq 404)", release)
                  self.assertIn("if($body.Length -gt 2048)", release)
                  self.assertIn("promotion-manifest.json", release)
                  self.assertIn("windows-validation-report.json", release)
                  self.assertIn("@('--target',$env:SOURCE_COMMIT)", release)
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one obsolete assertion block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
      - name: Verify focused and complete security invariants
        shell: bash
        run: |
          python3 -m unittest tools.test_security_invariants.SecurityInvariantTests.test_release_governance_rejects_publisher_bypass_and_asset_overwrite -v
          python3 -m unittest tools.test_security_invariants -v
      - name: Remove one-shot workflow and commit verified fix
        shell: bash
        run: |
          git rm .github/workflows/apply-release-invariant-fix.yml
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add tools/test_security_invariants.py
          git commit -m 'fix(ci): validate REST release publication probe'
          git push origin HEAD:fix/release-governance-rest-invariant
