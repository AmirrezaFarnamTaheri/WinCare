# Trigger revision 2
name: Apply PR 4 final review remediation

on:
  push:
    branches:
      - agent/standalone-release-hardening
    paths:
      - '.github/workflows/pr4-remediation.yml'
      - '.pr4-remediation/**'

permissions:
  contents: write

concurrency:
  group: pr4-final-remediation
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'AmirrezaFarnamTaheri/WinCare' && github.ref_name == 'agent/standalone-release-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/standalone-release-hardening
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Apply exact remediation and remove temporary publisher
        shell: bash
        run: |
          set -euo pipefail
          python .pr4-remediation/apply.py
          rm -rf .pr4-remediation .github/workflows/pr4-remediation.yml
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/ci.yml'); YAML.load_file('.github/workflows/release.yml')"
          python -m py_compile \
            tools/finalize_release.py \
            tools/prepare_standalone_payload.py \
            tools/verify_release.py \
            tools/verify_release_v3.py \
            tools/test_standalone_release.py
      - name: Run complete static and unit validation
        shell: bash
        env:
          TERM: xterm
        run: |
          set -euo pipefail
          validation_root="$RUNNER_TEMP/pr4-final-validation"
          mkdir -p "$validation_root"
          python tools/validate_source.py . --json-output "$validation_root/source-validation.json"
          python tools/validate_action_bindings.py . --output "$validation_root/action-binding-validation.json"
          python tools/validate_test_source_assertions.py . --output "$validation_root/test-source-validation.json"
          python tools/validate_powershell_calls.py . --output "$validation_root/public-call-bindings.json"
          python tools/validate_module_manifest.py . --output "$validation_root/module-source-manifest.json"
          python tools/validate_source_references.py . --output "$validation_root/source-reference-validation.json"
          python tools/audit_stub_inventory.py . --output "$validation_root/stub-inventory.json"
          python tools/validate_maintainability.py . --output "$validation_root/maintainability-validation.json"
          python tools/validate_network_egress.py . --output "$validation_root/network-egress-validation.json"
          python tools/validate_external_processes.py . --output "$validation_root/external-process-validation.json"
          python tools/validate_bounded_io.py . --output "$validation_root/bounded-io-validation.json"
          python tools/validate_read_only_state.py . --output "$validation_root/read-only-state-validation.json"
          python tools/validate_context_menu_catalog.py . --output "$validation_root/context-menu-validation.json"
          python tools/validate_test_fixtures.py . --output "$validation_root/test-fixture-validation.json"
          python -m unittest \
            tools.test_release_tools \
            tools.test_standalone_release \
            tools.test_maintainability \
            tools.test_security_invariants \
            tools.test_cleaner_preview \
            tools.test_gui \
            tools.test_source_references \
            tools.test_wincare_ps_source -v
          git diff --check
      - name: Commit, package, verify, and publish clean tree
        shell: bash
        env:
          TARGET_BRANCH: agent/standalone-release-hardening
          SOURCE_DATE_EPOCH: '315532800'
        run: |
          set -euo pipefail
          git config user.name 'WinCare Remediation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No remediation changes were produced.' >&2; exit 1; }
          git commit -m 'Resolve all remaining PR 4 review findings'
          release_root="$RUNNER_TEMP/pr4-release"
          rm -rf "$release_root"
          python tools/build_release.py . --output-directory "$release_root"
          version=$(python -c "import pathlib,re; text=pathlib.Path('src/WinCare/WinCare.psd1').read_text(encoding='utf-8'); print(re.search(r\"ModuleVersion\\s*=\\s*'([^']+)'\", text).group(1))")
          python tools/verify_release.py "$release_root/WinCare-$version.zip" --output "$RUNNER_TEMP/pr4-archive-validation.json"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
