name: apply-residual-remediation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip
          from pathlib import Path
          p=Path('.github/remediation/residual.patch.gz.b64').read_text().strip()
          Path('/tmp/residual.patch').write_bytes(gzip.decompress(base64.b64decode(p)))
          PY
          git apply --check /tmp/residual.patch
          git apply /tmp/residual.patch
          git rm -r .github/remediation .github/workflows/apply-residual-remediation.yml
      - name: Validate
        run: |
          python tools/validate_source.py .
          python tools/validate_action_bindings.py .
          python tools/validate_module_manifest.py .
          python tools/validate_source_references.py .
          python tools/validate_maintainability.py . --output artifacts/maintainability-validation.json
      - name: Commit
        run: |
          git config user.name 'WinCare CI Remediation'
          git config user.email 'ci-remediation@wincare.invalid'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close remaining Windows validation contracts'
          git push origin HEAD:${{ github.ref_name }}
