name: Remove obsolete PR 4 CI job

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: remove-obsolete-pr4-ci-job
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/standalone-release-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/standalone-release-hardening
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Remove obsolete job and temporary cleanup files
        shell: bash
        run: |
          set -euo pipefail
          python .ci-cleanup/remove_obsolete_job.py
          rm -rf .ci-cleanup .github/workflows/cleanup-obsolete-pr4-job.yml
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/ci.yml'); YAML.load_file('.github/workflows/release.yml')"
          python -m py_compile tools/*.py
          git diff --check
      - name: Run complete validation
        shell: bash
        env:
          TERM: xterm
          SOURCE_DATE_EPOCH: '315532800'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ci-cleanup-validation"
          mkdir -p "$root"
          python tools/validate_source.py . --json-output "$root/source-validation.json"
          python tools/validate_action_bindings.py . --output "$root/action-binding-validation.json"
          python tools/validate_test_source_assertions.py . --output "$root/test-source-validation.json"
          python tools/validate_powershell_calls.py . --output "$root/public-call-bindings.json"
          python tools/validate_module_manifest.py . --output "$root/module-source-manifest.json"
          python tools/validate_source_references.py . --output "$root/source-reference-validation.json"
          python tools/audit_stub_inventory.py . --output "$root/stub-inventory.json"
          python tools/validate_maintainability.py . --output "$root/maintainability-validation.json"
          python tools/validate_network_egress.py . --output "$root/network-egress-validation.json"
          python tools/validate_external_processes.py . --output "$root/external-process-validation.json"
          python tools/validate_bounded_io.py . --output "$root/bounded-io-validation.json"
          python tools/validate_read_only_state.py . --output "$root/read-only-state-validation.json"
          python tools/validate_context_menu_catalog.py . --output "$root/context-menu-validation.json"
          python tools/validate_test_fixtures.py . --output "$root/test-fixture-validation.json"
          python -m unittest \
            tools.test_release_tools \
            tools.test_standalone_release \
            tools.test_maintainability \
            tools.test_security_invariants \
            tools.test_cleaner_preview \
            tools.test_gui \
            tools.test_source_references \
            tools.test_wincare_ps_source -v
      - name: Commit, package, and verify exact clean tree
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '315532800'
        run: |
          set -euo pipefail
          git config user.name 'WinCare CI Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No cleanup changes were produced.' >&2; exit 1; }
          git commit -m 'Remove obsolete PR 4 CI remediation job'
          release_root="$RUNNER_TEMP/release"
          python tools/build_release.py . --output-directory "$release_root"
          version=$(python -c "import pathlib,re; text=pathlib.Path('src/WinCare/WinCare.psd1').read_text(encoding='utf-8'); print(re.search(r\"ModuleVersion\\s*=\\s*'([^']+)'\", text).group(1))")
          python tools/verify_release.py "$release_root/WinCare-$version.zip" --output "$RUNNER_TEMP/archive-validation.json"
          git push origin HEAD:refs/heads/agent/standalone-release-hardening
