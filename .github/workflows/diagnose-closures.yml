name: diagnose-closures

on:
  push:
    paths:
      - .github/workflows/diagnose-closures.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          $userModules = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell/Modules'
          New-Item -ItemType Directory -Force -Path $userModules | Out-Null
          Save-Module Pester -RequiredVersion 5.5.0 -Path $userModules -Force
      - name: Exclude late closure files in runner workspace
        shell: pwsh
        run: |
          $core = 'src/WinCare/SourceManifests/Core.psd1'
          $providers = 'src/WinCare/SourceManifests/Providers.psd1'
          (Get-Content -LiteralPath $core) | Where-Object { $_ -notmatch "Core/99-CompatibilityClosure\.ps1" } | Set-Content -LiteralPath $core -Encoding utf8
          (Get-Content -LiteralPath $providers) | Where-Object { $_ -notmatch "Providers/999[az]-.*Closure\.ps1" } | Set-Content -LiteralPath $providers -Encoding utf8
      - name: Run full Pester suite without closures
        id: pester
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.5.0 -Force
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = @('tests')
          $configuration.Run.PassThru = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = 'artifacts/closure-diagnostic.xml'
          $configuration.TestResult.OutputFormat = 'NUnitXml'
          $result = Invoke-Pester -Configuration $configuration
          [pscustomobject]@{
            Result = [string]$result.Result
            TotalCount = $result.TotalCount
            PassedCount = $result.PassedCount
            FailedCount = $result.FailedCount
            SkippedCount = $result.SkippedCount
            Failed = @($result.Failed | ForEach-Object {
              [pscustomobject]@{
                Name = $_.ExpandedName
                Path = $_.Path
                Line = $_.Line
                Error = [string]$_.ErrorRecord
              }
            })
          } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath artifacts/closure-diagnostic.json -Encoding utf8
          if ($result.FailedCount -gt 0) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: closure-diagnostic
          path: artifacts/closure-diagnostic.*
          if-no-files-found: error
