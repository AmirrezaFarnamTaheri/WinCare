name: apply-ci-remediation

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-closures.yml
      - .github/remediation/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Apply complete remediation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/remediation/part-* > /tmp/wincare-remediation.patch.gz.b64
          python - <<'PYCODE'
          import base64
          import gzip
          from pathlib import Path

          encoded = Path('/tmp/wincare-remediation.patch.gz.b64').read_text().strip()
          patch = gzip.decompress(base64.b64decode(encoded))
          Path('/tmp/wincare-remediation.patch').write_bytes(patch)
          PYCODE
          git apply --check /tmp/wincare-remediation.patch
          git apply /tmp/wincare-remediation.patch
          git rm -r .github/remediation .github/workflows/diagnose-closures.yml
      - name: Validate remediated tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python tools/validate_source.py .
          python tools/validate_action_bindings.py .
          python tools/validate_test_source_assertions.py .
          python tools/validate_powershell_calls.py .
          python tools/validate_module_manifest.py .
          python tools/validate_source_references.py .
          python tools/audit_stub_inventory.py .
          python tools/validate_maintainability.py . --output artifacts/maintainability-validation.json
          python tools/validate_network_egress.py .
          python tools/validate_external_processes.py .
          python tools/validate_bounded_io.py .
          python tools/validate_read_only_state.py .
          python tools/validate_context_menu_catalog.py .
          python tools/validate_test_fixtures.py .
          python tools/validate_gui.py .
          PYTHONPATH=. python tools/test_cleaner_preview.py
          PYTHONPATH=. python tools/test_gui.py
          PYTHONPATH=. python tools/test_gui_automation.py
          PYTHONPATH=. python tools/test_maintainability.py
          PYTHONPATH=. python tools/test_mutation_coverage.py
          PYTHONPATH=. python tools/test_release_tools.py
          PYTHONPATH=. python tools/test_security_invariants.py
          PYTHONPATH=. python tools/test_source_references.py
          PYTHONPATH=. python tools/test_wincare_ps_source.py
      - name: Commit atomic remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WinCare CI Remediation'
          git config user.email 'ci-remediation@wincare.invalid'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close maintainability and runtime contract regressions'
          git push origin "HEAD:${HEAD_REF}"
