name: Apply complete Windows release and brand finalization

on:
  push:
    branches:
      - agent/documentation-overhaul
    paths:
      - .github/workflows/apply-windows-release-brand-finalization.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 8.0.416

      - name: Ensure governed PowerShell modules
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -eq ([version]'5.9.0'))) {
              Install-Module Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Force
          }
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -eq ([version]'1.24.0'))) {
              Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          }

      - name: Capture expected RED contract evidence
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $redPath = Join-Path $env:RUNNER_TEMP 'windows-release-contracts-red.txt'
          $redOutput = (& python -m unittest tools.test_windows_release_pipeline -v 2>&1 | Out-String)
          $redExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          [IO.File]::WriteAllText(
              $redPath,
              $redOutput,
              [Text.UTF8Encoding]::new($false)
          )
          Write-Host $redOutput
          if ($redExit -eq 0) {
              throw 'The RED release contracts unexpectedly passed before implementation.'
          }
          "RED_EVIDENCE_PATH=$redPath" >> $env:GITHUB_ENV
          $ErrorActionPreference = 'Stop'

      - name: Apply exact source and brand candidate
        id: candidate
        run: |
          $ErrorActionPreference = 'Stop'
          python .wincare-finalize/apply.py
          python .wincare-finalize/apply-brand.py
          & .\tools\Generate-WinCareBrand.ps1 -Root $PWD
          python tools/validate_source_references.py . --write

          Remove-Item -LiteralPath .wincare-finalize -Recurse -Force
          Remove-Item -LiteralPath .github/workflows/windows-release-red.yml -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath .github/workflows/apply-windows-release-finalization.yml -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath .github/workflows/apply-windows-release-brand-finalization.yml -Force

          git config user.name 'wincare-release-bot'
          git config user.email 'wincare-release-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Candidate diff validation failed.' }
          git commit -m 'release: complete Windows lifecycle and WinCare brand'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate commit failed.' }
          $candidate = (git rev-parse HEAD).Trim()
          "sha=$candidate" >> $env:GITHUB_OUTPUT
          if (@(git status --porcelain).Count) {
              throw 'Candidate commit left a dirty source tree.'
          }

      - name: Run full GREEN structural and regression suite
        run: |
          $ErrorActionPreference = 'Stop'
          $validators = @(
              'validate_source.py',
              'validate_module_manifest.py',
              'validate_action_bindings.py',
              'validate_powershell_calls.py',
              'validate_test_source_assertions.py',
              'validate_source_references.py',
              'audit_stub_inventory.py',
              'validate_maintainability.py',
              'validate_network_egress.py',
              'validate_external_processes.py',
              'validate_bounded_io.py',
              'validate_read_only_state.py',
              'validate_context_menu_catalog.py',
              'validate_test_fixtures.py',
              'validate_gui.py'
          )
          foreach ($validator in $validators) {
              python (Join-Path tools $validator) .
              if ($LASTEXITCODE -ne 0) { throw "Validator failed: $validator" }
          }
          python -m unittest discover -s tools -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Python regression suite failed.' }
          & .\tools\Generate-WinCareBrand.ps1 -Root $PWD -Check
          & .\tools\Test-WinCareBrand.ps1 -Root $PWD
          if (@(git status --porcelain).Count) {
              throw 'GREEN validation dirtied the candidate tree.'
          }

      - name: Build verified previous-version fixture
        id: previous
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureOutput = Join-Path $env:RUNNER_TEMP 'wincare-previous-release'
          $fixtureResult = Join-Path $fixtureOutput 'previous-release-fixture.json'
          & .\tools\Build-PreviousReleaseFixture.ps1 `
              -Root $PWD `
              -OutputDirectory $fixtureOutput `
              -ResultPath $fixtureResult
          $result = [IO.File]::ReadAllText(
              $fixtureResult,
              [Text.UTF8Encoding]::new($false,$true)
          ) | ConvertFrom-Json -Depth 16
          if ($result.status -ne 'passed') {
              throw 'Previous-release fixture did not pass.'
          }
          "archive=$($result.archive)" >> $env:GITHUB_OUTPUT
          "result=$fixtureResult" >> $env:GITHUB_OUTPUT
          "version=$($result.previousVersion)" >> $env:GITHUB_OUTPUT
          if (@(git status --porcelain).Count) {
              throw 'Previous-version fixture build dirtied the candidate tree.'
          }

      - name: Execute complete Windows, .NET, release, and lifecycle validation
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'artifacts/windows-validation'
          & .\tools\Invoke-WindowsValidation.ps1 `
              -Root $PWD `
              -OutputDirectory $output `
              -PreviousReleaseArchivePath '${{ steps.previous.outputs.archive }}' `
              -GateTimeoutSeconds 7200
          if (@(git status --porcelain).Count) {
              throw 'Windows validation dirtied the candidate tree.'
          }

      - name: Verify closed release, brand, and supply-chain evidence
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'artifacts/windows-validation'
          Copy-Item -LiteralPath $env:RED_EVIDENCE_PATH `
              -Destination (Join-Path $output 'windows-release-contracts-red.txt')
          Copy-Item -LiteralPath '${{ steps.previous.outputs.result }}' `
              -Destination (Join-Path $output 'previous-release-fixture.json')

          $report = [IO.File]::ReadAllText(
              (Join-Path $output 'windows-validation-report.json'),
              [Text.UTF8Encoding]::new($false,$true)
          ) | ConvertFrom-Json -Depth 32
          if ($report.status -ne 'passed') {
              throw 'Windows validation report did not pass.'
          }

          $release = Join-Path $output 'release'
          $version = [string](Import-PowerShellDataFile .\src\WinCare\WinCare.psd1).ModuleVersion
          $required = @(
              "WinCare-$version.zip",
              "WinCare-$version.zip.sha256",
              "WinCare-$version-SBOM.spdx.json",
              "WinCare-$version-BUILD-RECEIPT.json",
              "WinCare-$version-release-receipt.json",
              "WinCare-$version.zip.intoto.jsonl",
              "WinCare-$version-build-result.json",
              'WinCare.Standalone.build.json',
              'WinCare.exe',
              'WinCare-GUI.exe',
              'WinCare-TUI.exe',
              'WinCare.Brand.json',
              'WinCare-Mark.svg',
              'WinCare-Logo.svg',
              'WinCare-Logo.png',
              'WinCare-Logo-256.png',
              'WinCare.ico'
          )
          foreach ($name in $required) {
              $path = Join-Path $release $name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Missing release evidence or brand asset: $name"
              }
              if ((Get-Item -LiteralPath $path -Force).Length -lt 1) {
                  throw "Empty release evidence or brand asset: $name"
              }
          }

          $brand = [IO.File]::ReadAllText(
              (Join-Path $release 'WinCare.Brand.json'),
              [Text.UTF8Encoding]::new($false,$true)
          ) | ConvertFrom-Json -Depth 24
          $standalone = [IO.File]::ReadAllText(
              (Join-Path $release 'WinCare.Standalone.build.json'),
              [Text.UTF8Encoding]::new($false,$true)
          ) | ConvertFrom-Json -Depth 24
          if ([string]$brand.schema -ne 'wincare.brand/v1') {
              throw 'Release brand manifest schema is invalid.'
          }
          $expectedIcon = ([string]$brand.assets.appIcon.sha256).ToLowerInvariant()
          if (([string]$standalone.IconSha256).ToLowerInvariant() -ne $expectedIcon) {
              throw 'Standalone icon identity does not match the brand manifest.'
          }
          foreach ($artifact in @($standalone.Artifacts)) {
              if (-not [bool]$artifact.EmbeddedIconVerified) {
                  throw "Embedded logo was not verified: $($artifact.Name)"
              }
              if (([string]$artifact.IconSha256).ToLowerInvariant() -ne $expectedIcon) {
                  throw "Embedded logo hash mismatch: $($artifact.Name)"
              }
          }

          $checksumLine = [IO.File]::ReadAllText(
              (Join-Path $release "WinCare-$version.zip.sha256"),
              [Text.UTF8Encoding]::new($false,$true)
          ).Trim()
          $archiveHash = (Get-FileHash `
              -LiteralPath (Join-Path $release "WinCare-$version.zip") `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if (-not $checksumLine.StartsWith(
              $archiveHash,
              [StringComparison]::OrdinalIgnoreCase
          )) {
              throw 'Archive checksum companion does not match the release archive.'
          }

          $assets = @(
              Get-ChildItem -LiteralPath $release -File -Force |
                  Sort-Object Name |
                  ForEach-Object {
                      [ordered]@{
                          name = $_.Name
                          bytes = [long]$_.Length
                          sha256 = (Get-FileHash `
                              -LiteralPath $_.FullName `
                              -Algorithm SHA256
                          ).Hash.ToLowerInvariant()
                      }
                  }
          )
          $signatures = @(
              foreach ($name in @('WinCare.exe','WinCare-GUI.exe','WinCare-TUI.exe')) {
                  $signature = Get-AuthenticodeSignature `
                      -LiteralPath (Join-Path $release $name)
                  [ordered]@{
                      name = $name
                      status = [string]$signature.Status
                      statusMessage = [string]$signature.StatusMessage
                      signerSubject = if ($signature.SignerCertificate) {
                          [string]$signature.SignerCertificate.Subject
                      } else {
                          $null
                      }
                  }
              }
          )
          $inventory = [ordered]@{
              schema = 'wincare.supply-chain.inventory/v3'
              status = 'passed'
              version = $version
              sourceCommit = '${{ steps.candidate.outputs.sha }}'
              previousFixtureVersion = '${{ steps.previous.outputs.version }}'
              brand = [ordered]@{
                  schema = [string]$brand.schema
                  iconSha256 = $expectedIcon
                  manifestSha256 = (Get-FileHash `
                      -LiteralPath (Join-Path $release 'WinCare.Brand.json') `
                      -Algorithm SHA256
                  ).Hash.ToLowerInvariant()
              }
              toolchain = [ordered]@{
                  operatingSystem = [Environment]::OSVersion.VersionString
                  powershell = $PSVersionTable.PSVersion.ToString()
                  dotnet = (dotnet --version).Trim()
                  python = ((python --version) 2>&1 | Out-String).Trim()
                  pester = [string]((Get-Module -ListAvailable Pester |
                      Where-Object Version -ge ([version]'5.5.0') |
                      Sort-Object Version -Descending |
                      Select-Object -First 1).Version)
                  psscriptAnalyzer = [string]((Get-Module -ListAvailable PSScriptAnalyzer |
                      Where-Object Version -ge ([version]'1.24.0') |
                      Sort-Object Version -Descending |
                      Select-Object -First 1).Version)
              }
              authenticode = $signatures
              assets = $assets
          }
          [IO.File]::WriteAllText(
              (Join-Path $output 'supply-chain-inventory.json'),
              (($inventory | ConvertTo-Json -Depth 24) + [Environment]::NewLine),
              [Text.UTF8Encoding]::new($false)
          )

      - name: Upload complete Windows release evidence
        id: release-evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wincare-windows-release-${{ steps.candidate.outputs.sha }}
          path: ${{ runner.temp }}/artifacts/windows-validation
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Record durable evidence and publish branch
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'artifacts/windows-validation'
          $report = [IO.File]::ReadAllText(
              (Join-Path $output 'windows-validation-report.json'),
              [Text.UTF8Encoding]::new($false,$true)
          ) | ConvertFrom-Json -Depth 32
          $inventory = [IO.File]::ReadAllText(
              (Join-Path $output 'supply-chain-inventory.json'),
              [Text.UTF8Encoding]::new($false,$true)
          ) | ConvertFrom-Json -Depth 32
          $gateRows = @(
              $report.gates | ForEach-Object {
                  "| $($_.Name) | $($_.Status) | $($_.DurationSeconds) s |"
              }
          ) -join "`n"
          $signatureRows = @(
              $inventory.authenticode | ForEach-Object {
                  "| $($_.name) | $($_.status) | $($_.signerSubject) |"
              }
          ) -join "`n"
          $runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          $document = @"
          # Windows release validation evidence

          ## Verdict

          **Verified for source integrity, deterministic branding, Windows runtime, .NET publishing, release construction, and the complete installer lifecycle.**

          Candidate `${{ steps.candidate.outputs.sha }}` passed all available product gates. Production Authenticode signing remains an externally governed release credential and its real status is disclosed below.

          ## Reproducible execution

          - Workflow: $runUrl
          - Candidate: `${{ steps.candidate.outputs.sha }}`
          - Evidence artifact: `${{ steps.release-evidence.outputs.artifact-url }}`
          - Artifact ID: `${{ steps.release-evidence.outputs.artifact-id }}`
          - Artifact SHA-256: `${{ steps.release-evidence.outputs.artifact-digest }}`
          - Previous-version fixture: `$($inventory.previousFixtureVersion)`
          - Brand schema: `$($inventory.brand.schema)`
          - Brand icon SHA-256: `$($inventory.brand.iconSha256)`

          ## Gate results

          | Gate | Status | Duration |
          | --- | --- | ---: |
          $gateRows

          ## Lifecycle proof

          The evidence bundle proves clean install, executable self-tests, repair, force recovery, rejected-tamper rollback, lower-version-to-current upgrade, installation identity preservation, user-data preservation, explicit branded shortcut identity, strict uninstall, and corrupt-install removal.

          ## Brand and executable proof

          One geometry contract generated the SVG lockups, PNG assets, and seven-frame ICO. Reproducibility, manifest hashes, ICO frame structure, release inclusion, shortcut `IconLocation`, and the embedded pixels of `WinCare.exe`, `WinCare-GUI.exe`, and `WinCare-TUI.exe` were verified.

          ## Authenticode disclosure

          | Executable | Status | Signer |
          | --- | --- | --- |
          $signatureRows
          "@
          $document = (
              $document -split "`r?`n" |
                  ForEach-Object { $_ -replace '^          ', '' }
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText(
              (Join-Path $PWD 'docs\WINDOWS-VALIDATION-EVIDENCE.md'),
              ($document + [Environment]::NewLine),
              [Text.UTF8Encoding]::new($false)
          )
          git add docs/WINDOWS-VALIDATION-EVIDENCE.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Evidence diff validation failed.' }
          git commit -m 'test: record final Windows and brand evidence'
          if ($LASTEXITCODE -ne 0) { throw 'Evidence commit failed.' }
          if (@(git status --porcelain).Count) {
              throw 'Evidence commit left a dirty tree.'
          }
          git push origin "HEAD:${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { throw 'Publishing verified commits failed.' }

      - name: Publish finalization summary
        run: |
          @"
          ## WinCare complete finalization

          - Candidate: `${{ steps.candidate.outputs.sha }}`
          - Previous fixture: `${{ steps.previous.outputs.version }}`
          - Artifact digest: `${{ steps.release-evidence.outputs.artifact-digest }}`
          - Brand: generated, reproducible, installer-bound, and embedded in all app binaries
          - Result: all source, Windows, .NET, lifecycle, release, and supply-chain gates passed
          "@ >> $env:GITHUB_STEP_SUMMARY
