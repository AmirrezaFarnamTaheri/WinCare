name: Patch CLI finalizer entrypoint

on:
  push:
    branches: [arena/01a06cc8-wincare]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: arena/01a06cc8-wincare
      - name: Include plugin CLI executable source in finalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/finalize_native_release.py')
          text = path.read_text(encoding='utf-8')
          needle = '    "tools/__init__.py",\n'
          addition = '    "tools/__init__.py",\n    "tools/wincare-plugin-cli/bin/wincare-plugin.js",\n'
          if '"tools/wincare-plugin-cli/bin/wincare-plugin.js"' not in text:
              if needle not in text:
                  raise SystemExit('NATIVE_TOOL_FILES anchor changed unexpectedly')
              text = text.replace(needle, addition, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/finalize_native_release.py
          git commit -m "build: include plugin CLI entrypoint in source archive"
          git push origin HEAD:arena/01a06cc8-wincare
