name: Native Python Gates

# Runs the WinUI-3 / Rust focused Python verification suite on every push and PR.
# Complements the full Windows CI by providing fast, cross-platform gate feedback
# for all design-system, contrast, GUI structure, and source-contract checks.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-python-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  python-gates:
    name: Python verification gates (design, contrast, GUI, source)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Describe gate context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, sys
          ctx = {
              "schema": "wincare.workflow.context/v1",
              "job": "native-python-gates",
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "ref": os.environ.get("GITHUB_REF"),
              "sha": os.environ.get("GITHUB_SHA"),
              "python": sys.version,
          }
          print(json.dumps(ctx, indent=2))
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as f:
              f.write("## Native Python Gates context\n\n")
              f.write(f"- Event: `{ctx['event']}`\n")
              f.write(f"- Ref: `{ctx['ref']}`\n")
              f.write(f"- SHA: `{ctx['sha']}`\n")
              f.write(f"- Python: `{sys.version.split()[0]}`\n\n")
          PY

      - name: Gate 1 — Visual token completeness (Light + Dark + HighContrast)
        id: tokens
        shell: bash
        run: python tools/verify_visual_tokens.py

      - name: Gate 2 — WCAG 2.1 AA pill contrast (8 pairs, min 4.5:1)
        id: contrast
        shell: bash
        run: python tools/verify_pill_contrast.py

      - name: Gate 3 — GUI structure and WinUI 3 ThemeResource validation
        id: gui_validate
        shell: bash
        run: python tools/validate_gui.py

      - name: Gate 4 — GUI unit tests (layout, binding, accessibility)
        id: gui_tests
        shell: bash
        run: python -m unittest tools.test_gui -v

      - name: Publish gate summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib
          outcomes = {
              "tokens": "${{ steps.tokens.outcome }}",
              "contrast": "${{ steps.contrast.outcome }}",
              "gui_validate": "${{ steps.gui_validate.outcome }}",
              "gui_tests": "${{ steps.gui_tests.outcome }}",
          }
          labels = {
              "tokens": "Visual token completeness",
              "contrast": "WCAG AA pill contrast",
              "gui_validate": "GUI structure validation",
              "gui_tests": "GUI unit tests",
          }
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as f:
              f.write("## Native Python Gate Results\n\n")
              f.write("| Gate | Description | Result |\n")
              f.write("|---|---|---:|\n")
              for key, outcome in outcomes.items():
                  icon = "✅" if outcome == "success" else "❌"
                  f.write(f"| `{key}` | {labels[key]} | {icon} {outcome} |\n")
              overall = "✅ passed" if all(v == "success" for v in outcomes.values()) else "❌ failed"
              f.write(f"\nOverall: **{overall}**\n")
          PY

  rust-gates:
    name: Rust FFI safety gates (fmt, clippy, test — x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Format check
        shell: bash
        run: cargo fmt --manifest-path native/Cargo.toml --check

      - name: Clippy (deny warnings)
        shell: bash
        run: >-
          cargo clippy
          --manifest-path native/Cargo.toml
          --target x86_64-pc-windows-msvc
          --all-targets --all-features
          -- -D warnings

      - name: Unit and FFI contract tests
        shell: bash
        run: >-
          cargo test
          --manifest-path native/Cargo.toml
          --target x86_64-pc-windows-msvc

      - name: Release build smoke-check
        shell: bash
        run: >-
          cargo build
          --manifest-path native/Cargo.toml
          --target x86_64-pc-windows-msvc
          --release

  dotnet-build:
    name: .NET restore, test, and build (x64)
    runs-on: windows-latest
    timeout-minutes: 40
    needs: rust-gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@6df8cefd1440cf9313e76b8fdb8aaf90cfa745a3 # v6.0.0
        with:
          global-json-file: global.json

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Build Rust core for x64
        shell: bash
        run: >-
          cargo build
          --manifest-path native/Cargo.toml
          --target x86_64-pc-windows-msvc
          --release

      - name: Stage Rust DLL
        shell: bash
        run: |
          mkdir -p src/WinCare.App/Native/x64
          cp native/target/x86_64-pc-windows-msvc/release/wincare_core.dll \
             src/WinCare.App/Native/x64/wincare_core.dll

      - name: Restore NuGet packages
        shell: bash
        run: dotnet restore WinCare.Native.sln -p:Platform=x64

      - name: Run managed unit tests
        shell: bash
        run: >-
          dotnet test WinCare.Native.sln
          -c Release -p:Platform=x64
          --no-restore
          --logger "console;verbosity=normal"

      - name: Build WinCare.App (MSIX)
        shell: bash
        run: >-
          dotnet build src/WinCare.App/WinCare.App.csproj
          -c Release -p:Platform=x64
          -p:GenerateAppxPackageOnBuild=true
          --no-restore
