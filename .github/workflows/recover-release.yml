name: recover sealed release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed release workflow run ID containing the sealed candidate artifact.
        required: true
        type: string
      tag:
        description: Existing immutable SemVer tag to recover, for example v2.0.0.
        required: true
        type: string
      version:
        description: Release version without the v prefix, for example 2.0.0.
        required: true
        type: string
      source_commit:
        description: Full source commit SHA recorded in the promotion manifest.
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover-release:
    name: Reverify and recover sealed release
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      EXPECTED_TAG: ${{ inputs.tag }}
      EXPECTED_VERSION: ${{ inputs.version }}
      EXPECTED_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: win-care-validated-release-candidate
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify sealed recovery candidate
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:EXPECTED_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'){throw "Recovery tag is not strict SemVer: $env:EXPECTED_TAG"}
          if($env:EXPECTED_VERSION -ne $env:EXPECTED_TAG.Substring(1)){throw 'Recovery version does not match the recovery tag.'}
          if($env:EXPECTED_COMMIT -notmatch '^[0-9a-fA-F]{40}$'){throw 'Recovery source commit must be a full SHA-1.'}
          if($env:SOURCE_RUN_ID -notmatch '^[1-9]\d*$'){throw 'Recovery run ID must be a positive integer.'}

          function Read-BoundedUtf8Text {
            param([Parameter(Mandatory)][string]$LiteralPath,[ValidateRange(1,16777216)][int]$MaximumBytes)
            $item=Get-Item -LiteralPath $LiteralPath -Force -ErrorAction Stop
            if($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or [long]$item.Length -gt $MaximumBytes){throw "Unsafe or oversized text file: $LiteralPath"}
            $bytes=[IO.File]::ReadAllBytes($item.FullName)
            try{if($bytes.Length -ne [long]$item.Length){throw "Text file changed while reading: $LiteralPath"};[Text.UTF8Encoding]::new($false,$true).GetString($bytes)}finally{if($bytes.Length){[Array]::Clear($bytes,0,$bytes.Length)}}
          }

          $tagRef=& gh api "repos/$env:GH_REPO/git/ref/tags/$env:EXPECTED_TAG"|ConvertFrom-Json -Depth 20
          if($LASTEXITCODE -ne 0){throw "Unable to resolve tag $env:EXPECTED_TAG."}
          $tagObjectType=[string]$tagRef.object.type
          $tagCommit=[string]$tagRef.object.sha
          if($tagObjectType -eq 'tag'){
            $annotatedTag=& gh api "repos/$env:GH_REPO/git/tags/$tagCommit"|ConvertFrom-Json -Depth 20
            if($LASTEXITCODE -ne 0){throw "Unable to resolve annotated tag object $tagCommit."}
            $tagObjectType=[string]$annotatedTag.object.type
            $tagCommit=[string]$annotatedTag.object.sha
          }
          if($tagObjectType -ne 'commit' -or $tagCommit -ne $env:EXPECTED_COMMIT){throw "Tag $env:EXPECTED_TAG resolves to $tagObjectType $tagCommit instead of commit $env:EXPECTED_COMMIT."}

          $root=[IO.Path]::GetFullPath('./candidate')
          $manifestPath=Join-Path $root 'promotion-manifest.json'
          $reportPath=Join-Path $root 'windows-validation-report.json'
          $manifest=Read-BoundedUtf8Text $manifestPath 1048576|ConvertFrom-Json -Depth 20
          if([string]$manifest.schema -ne 'wincare.promotion-manifest/v2'){throw 'Unsupported promotion manifest.'}
          if([string]$manifest.sourceCommit -ne $env:EXPECTED_COMMIT){throw 'Promotion source commit mismatch.'}
          if([string]$manifest.tag -ne $env:EXPECTED_TAG -or [string]$manifest.version -ne $env:EXPECTED_VERSION){throw 'Promotion release identity mismatch.'}
          if([string]$manifest.workflowRunId -ne $env:SOURCE_RUN_ID){throw 'Promotion workflow run ID mismatch.'}
          if([string]$manifest.validationReport.status -ne 'passed'){throw 'Promotion validation status is not passed.'}
          if((Get-FileHash -LiteralPath $reportPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$manifest.validationReport.sha256){throw 'Validation report hash mismatch.'}

          $release=Join-Path $root 'release'
          $records=@($manifest.files)
          if($records.Count -ne 12){throw 'Promotion manifest must contain exactly twelve release assets.'}
          $expected=[Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach($record in $records){
            $relative=[string]$record.path
            if($relative -notmatch '^release/[A-Za-z0-9][A-Za-z0-9._+-]*$' -or -not $expected.Add($relative)){throw "Unsafe or duplicate promotion path: $relative"}
            $path=Join-Path $root $relative
            $item=Get-Item -LiteralPath $path -Force -ErrorAction Stop
            if($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)){throw "Unsafe promotion asset: $relative"}
            if([long]$item.Length -ne [long]$record.bytes){throw "Promotion size mismatch: $relative"}
            if((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$record.sha256){throw "Promotion hash mismatch: $relative"}
          }
          $actual=@(Get-ChildItem -LiteralPath $release -File -Force|ForEach-Object{'release/'+$_.Name})
          if(@($actual|Where-Object{-not $expected.Contains($_)}).Count -or @($expected|Where-Object{$_ -notin $actual}).Count){throw 'Promotion asset membership mismatch.'}

          "release_dir=$release"|Out-File $env:GITHUB_OUTPUT -Append
          "manifest_path=$manifestPath"|Out-File $env:GITHUB_OUTPUT -Append
          "report_path=$reportPath"|Out-File $env:GITHUB_OUTPUT -Append
          Add-Content $env:GITHUB_STEP_SUMMARY "Recovered and independently verified sealed candidate from run **$env:SOURCE_RUN_ID** for **$env:EXPECTED_TAG**, commit ``$env:EXPECTED_COMMIT``, with **$($records.Count)** exact assets.`n"

      - name: Inspect publication state
        id: publication
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{
            Accept='application/vnd.github+json'
            Authorization="Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='WinCare-release-recovery-workflow'
          }
          $encodedTag=[Uri]::EscapeDataString($env:EXPECTED_TAG)
          $uri="https://api.github.com/repos/$env:GH_REPO/releases/tags/$encodedTag"
          $response=Invoke-WebRequest -Method Get -Uri $uri -Headers $headers -SkipHttpErrorCheck
          $statusCode=[int]$response.StatusCode
          if($statusCode -eq 200){
            $release=$response.Content|ConvertFrom-Json -Depth 20
            if([string]$release.tag_name -ne $env:EXPECTED_TAG){throw 'Release lookup returned an unexpected tag.'}
            "exists=true"|Out-File $env:GITHUB_OUTPUT -Append
            Add-Content $env:GITHUB_STEP_SUMMARY "Release **$env:EXPECTED_TAG** already exists; its immutable bytes will be compared with the sealed candidate.`n"
          }elseif($statusCode -eq 404){
            "exists=false"|Out-File $env:GITHUB_OUTPUT -Append
          }else{
            $body=([string]$response.Content).Trim()
            if($body.Length -gt 2048){$body=$body.Substring(0,2048)}
            throw "Unable to determine publication state for $env:EXPECTED_TAG`: GitHub API returned HTTP $statusCode. $body"
          }

      - name: Attest exact recovery assets
        if: steps.publication.outputs.exists != 'true'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.verify.outputs.release_dir }}/*

      - name: Publish exact recovered assets
        id: publish
        if: steps.publication.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $releaseDirectory='${{ steps.verify.outputs.release_dir }}'
          $candidateRoot=Split-Path -Parent $releaseDirectory
          $assets=@(
            Get-ChildItem -LiteralPath $releaseDirectory -File -Force|Sort-Object Name|ForEach-Object FullName
            Join-Path $candidateRoot 'windows-validation-report.json'
            Join-Path $candidateRoot 'promotion-manifest.json'
          )
          if($assets.Count -ne 14){throw "Expected fourteen publication files, found $($assets.Count)."}
          foreach($asset in $assets){
            $item=Get-Item -LiteralPath $asset -Force
            Write-Host "asset=$($item.Name) bytes=$($item.Length) sha256=$((Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
          $arguments=@('release','create',$env:EXPECTED_TAG)+$assets+@(
            '--verify-tag',
            '--title',"WinCare v$env:EXPECTED_VERSION",
            '--notes',"Recovered from sealed workflow run $env:SOURCE_RUN_ID. Exact-byte Windows-validated standalone release with v3 receipts, SBOM, checksums, native provenance, lifecycle evidence, diagnostic indexes, and attestations."
          )
          & gh @arguments
          if($LASTEXITCODE -ne 0){throw "GitHub release creation failed with exit code $LASTEXITCODE."}
          Add-Content $env:GITHUB_STEP_SUMMARY "Published recovered release **$env:EXPECTED_TAG** with **$($assets.Count)** pre-validated files. No bytes were rebuilt.`n"

      - name: Verify recovered immutable release
        if: always() && (steps.publication.outputs.exists == 'true' || steps.publish.outcome == 'success')
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Read-BoundedUtf8Text {
            param([Parameter(Mandatory)][string]$LiteralPath,[ValidateRange(1,16777216)][int]$MaximumBytes)
            $item=Get-Item -LiteralPath $LiteralPath -Force -ErrorAction Stop
            if($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or [long]$item.Length -gt $MaximumBytes){throw "Unsafe or oversized text file: $LiteralPath"}
            $bytes=[IO.File]::ReadAllBytes($item.FullName)
            try{if($bytes.Length -ne [long]$item.Length){throw "Text file changed while reading: $LiteralPath"};[Text.UTF8Encoding]::new($false,$true).GetString($bytes)}finally{if($bytes.Length){[Array]::Clear($bytes,0,$bytes.Length)}}
          }

          $published=[IO.Path]::GetFullPath('./published-release')
          New-Item -ItemType Directory -Path $published -Force|Out-Null
          & gh release download $env:EXPECTED_TAG --dir $published
          if($LASTEXITCODE -ne 0){throw "Failed to download published release $env:EXPECTED_TAG."}
          $allPublished=@(Get-ChildItem -LiteralPath $published -File -Force)
          if($allPublished.Count -ne 14){throw "Published release must contain exactly fourteen files; found $($allPublished.Count)."}

          $publishedManifestPath=Join-Path $published 'promotion-manifest.json'
          $publishedReportPath=Join-Path $published 'windows-validation-report.json'
          $publishedManifest=Read-BoundedUtf8Text $publishedManifestPath 1048576|ConvertFrom-Json -Depth 20
          if([string]$publishedManifest.schema -ne 'wincare.promotion-manifest/v2'){throw 'Published promotion manifest schema mismatch.'}
          if([string]$publishedManifest.sourceCommit -ne $env:EXPECTED_COMMIT -or [string]$publishedManifest.version -ne $env:EXPECTED_VERSION -or [string]$publishedManifest.tag -ne $env:EXPECTED_TAG){throw 'Published release identity mismatch.'}
          if([string]$publishedManifest.workflowRunId -ne $env:SOURCE_RUN_ID){throw 'Published release workflow run ID mismatch.'}
          if((Get-FileHash -LiteralPath $publishedReportPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$publishedManifest.validationReport.sha256){throw 'Published validation report hash mismatch.'}

          $candidateRelease='${{ steps.verify.outputs.release_dir }}'
          $records=@($publishedManifest.files)
          if($records.Count -ne 12){throw 'Published promotion manifest must contain exactly twelve release assets.'}
          foreach($record in $records){
            $name=[IO.Path]::GetFileName([string]$record.path)
            $candidatePath=Join-Path $candidateRelease $name
            $publishedPath=Join-Path $published $name
            foreach($path in @($candidatePath,$publishedPath)){if(-not(Test-Path -LiteralPath $path -PathType Leaf)){throw "Missing release asset: $path"}}
            $candidateHash=(Get-FileHash -LiteralPath $candidatePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $publishedHash=(Get-FileHash -LiteralPath $publishedPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if($candidateHash -ne [string]$record.sha256 -or $publishedHash -ne [string]$record.sha256){throw "Immutable release byte mismatch: $name"}
            if((Get-Item -LiteralPath $candidatePath).Length -ne [long]$record.bytes -or (Get-Item -LiteralPath $publishedPath).Length -ne [long]$record.bytes){throw "Immutable release size mismatch: $name"}
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "Re-downloaded and verified **$env:EXPECTED_TAG**: all 12 product assets match the sealed recovery candidate and promotion manifest exactly.`n"
