name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment. Auto uses Conventional Commit messages since the latest release tag.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  WINCARE_EVENT_NAME: ${{ github.event_name }}
  WINCARE_REF: ${{ github.ref }}
  WINCARE_REF_NAME: ${{ github.ref_name }}
  WINCARE_SHA: ${{ github.sha }}
  WINCARE_RUN_ID: ${{ github.run_id }}
  WINCARE_RUN_ATTEMPT: ${{ github.run_attempt }}

jobs:
  build-validate:
    name: Version, build, diagnose, and seal immutable candidate
    runs-on: windows-2022
    timeout-minutes: 110
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@6df8cefd1440cf9313e76b8fdb8aaf90cfa745a3 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test automatic release versioning
        shell: pwsh
        run: python -m unittest tools/test_resolve_release_version.py -v
      - name: Resolve immutable release identity
        id: version
        shell: pwsh
        env:
          REQUESTED_BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          $ErrorActionPreference='Stop'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git config user.name 'github-actions[bot]'
          & python tools/resolve_release_version.py `
            --repo . `
            --event-name $env:WINCARE_EVENT_NAME `
            --ref-name $env:WINCARE_REF_NAME `
            --bump $env:REQUESTED_BUMP `
            --github-output $env:GITHUB_OUTPUT
          if($LASTEXITCODE -ne 0){throw "Release identity resolution failed with exit code $LASTEXITCODE."}
      - name: Materialize immutable release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='${{ steps.version.outputs.tag }}'
          $sourceCommit='${{ steps.version.outputs.source_commit }}'
          $created='${{ steps.version.outputs.created }}'
          if($created -eq 'true'){
            $basic=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
            & git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push origin "refs/tags/$tag"
            if($LASTEXITCODE -ne 0){throw "Failed to reserve release tag $tag."}
          }else{
            & git checkout --detach $sourceCommit
            if($LASTEXITCODE -ne 0){throw "Failed to check out resolved release commit $sourceCommit."}
          }
          $actualCommit=(& git rev-parse HEAD).Trim()
          $tagCommit=(& git rev-list -n 1 "$tag^{}").Trim()
          if($actualCommit -ne $sourceCommit -or $tagCommit -ne $sourceCommit){
            throw "Release identity mismatch: HEAD=$actualCommit tag=$tagCommit expected=$sourceCommit"
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "## Automated release identity`n`n- Version: **${{ steps.version.outputs.version }}**`n- Tag: ``$tag```n- Source commit: ``$sourceCommit```n- Mode: **${{ steps.version.outputs.mode }}**`n- Increment: **${{ steps.version.outputs.bump }}**`n"
      - name: Describe release builder context
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ steps.version.outputs.source_commit }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path ./artifacts/windows-validation/workflow -Force | Out-Null
          $context=[ordered]@{
            schema='wincare.workflow.context/v1';job='release-build-validate';event=$env:WINCARE_EVENT_NAME
            ref=$env:WINCARE_REF;refName=$env:WINCARE_REF_NAME;sha=$env:RELEASE_COMMIT;tag=$env:RELEASE_TAG
            runId=$env:WINCARE_RUN_ID;runAttempt=$env:WINCARE_RUN_ATTEMPT
            powershell=$PSVersionTable.PSVersion.ToString();dotnet=((& dotnet --version).Trim());python=((& python --version 2>&1|Out-String).Trim())
          }
          $context|ConvertTo-Json -Depth 8|Set-Content ./artifacts/windows-validation/workflow/context.json -Encoding utf8NoBOM
          $context|ConvertTo-Json -Depth 8
          "## Release builder context`n`n- Commit: ``$env:RELEASE_COMMIT```n- Tag: ``$env:RELEASE_TAG```n- Ref: ``$env:WINCARE_REF```n- PowerShell: ``$($context.powershell)```n- .NET SDK: ``$($context.dotnet)```n- Python: ``$($context.python)```n"|Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Install PowerShell validation modules
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          $userModules=Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell/Modules'
          New-Item -ItemType Directory -Force -Path $userModules|Out-Null
          Save-Module Pester -RequiredVersion 5.5.0 -Path $userModules -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Scope CurrentUser -Force
          Get-Module Pester,PSScriptAnalyzer -ListAvailable|Sort-Object Name,Version -Descending|Select-Object Name,Version,Path|Format-Table -AutoSize
      - name: Run complete Windows validation and candidate build
        id: validation
        continue-on-error: true
        shell: pwsh
        env:
          WINCARE_DIAGNOSTICS_DIRECTORY: ${{ github.workspace }}\artifacts\windows-validation\workflow
        run: ./tools/Invoke-WindowsValidation.ps1 -OutputDirectory ./artifacts/windows-validation -GateTimeoutSeconds 3600
      - name: Summarize release-build diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $root=[IO.Path]::GetFullPath('./artifacts/windows-validation')
          $reportPath=Join-Path $root 'windows-validation-report.json'
          $gates=@();$reportStatus='missing'
          if(Test-Path -LiteralPath $reportPath -PathType Leaf){
            try{$report=[IO.File]::ReadAllText($reportPath,[Text.UTF8Encoding]::new($false,$true))|ConvertFrom-Json -Depth 50;$gates=@($report.gates);$reportStatus=[string]$report.status}catch{Write-Warning "Invalid report: $_"}
          }
          $release=Join-Path $root 'release'
          $assets=@(Get-ChildItem -LiteralPath $release -File -Force -ErrorAction SilentlyContinue|Sort-Object Name|ForEach-Object{[ordered]@{name=$_.Name;bytes=[long]$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}})
          $files=@(Get-ChildItem -LiteralPath $root -File -Recurse -Force -ErrorAction SilentlyContinue|Sort-Object FullName|ForEach-Object{[ordered]@{path=[IO.Path]::GetRelativePath($root,$_.FullName).Replace('\','/');bytes=[long]$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}})
          $diagnosis=[ordered]@{schema='wincare.workflow.diagnostics/v1';job='release-build-validate';stepOutcome='${{ steps.validation.outcome }}';reportStatus=$reportStatus;gates=@($gates);releaseAssets=@($assets);artifacts=@($files)}
          New-Item -ItemType Directory -Path (Join-Path $root 'workflow') -Force|Out-Null
          $diagnosis|ConvertTo-Json -Depth 16|Set-Content (Join-Path $root 'workflow/diagnostics-index.json') -Encoding utf8NoBOM
          Add-Content $env:GITHUB_STEP_SUMMARY "## Release build and validation`n"
          Add-Content $env:GITHUB_STEP_SUMMARY "Validation outcome: **${{ steps.validation.outcome }}**; report status: **$reportStatus**.`n"
          if($gates.Count){
            Add-Content $env:GITHUB_STEP_SUMMARY '| Gate | Status | Exit | Duration |'
            Add-Content $env:GITHUB_STEP_SUMMARY '|---|---:|---:|---:|'
            foreach($gate in $gates){$icon=if([string]$gate.Status -eq 'passed'){'passed'}else{'failed'};Add-Content $env:GITHUB_STEP_SUMMARY "| $($gate.Name) | $icon $($gate.Status) | $($gate.ExitCode) | $($gate.DurationMilliseconds) ms |"}
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "`n### Candidate asset inventory ($($assets.Count))`n"
          if($assets.Count){Add-Content $env:GITHUB_STEP_SUMMARY '| Asset | Bytes | SHA-256 |';Add-Content $env:GITHUB_STEP_SUMMARY '|---|---:|---|';foreach($asset in $assets){Add-Content $env:GITHUB_STEP_SUMMARY "| ``$($asset.name)`` | $($asset.bytes) | ``$($asset.sha256)`` |"}}
          foreach($gate in @($gates|Where-Object Status -ne 'passed')){
            Write-Host "`n===== FAILED RELEASE GATE: $($gate.Name) status=$($gate.Status) exit=$($gate.ExitCode) =====" -ForegroundColor Red
            foreach($path in @([string]$gate.StdOut,[string]$gate.StdErr)){if(Test-Path -LiteralPath $path -PathType Leaf){foreach($line in @([IO.File]::ReadAllLines($path)|Select-Object -Last 240)){Write-Host $line}}}
          }
      - name: Enforce candidate validation result
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.validation.outcome }}' -ne 'success') { throw 'Candidate validation failed. Review the gate table, log tails, and diagnostics-index.json before retrying.' }
      - name: Seal exact candidate assets
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ steps.version.outputs.source_commit }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference='Stop'
          . './tools/Invoke-BoundedFileRead.ps1'
          $root=[IO.Path]::GetFullPath('./artifacts/windows-validation');$release=Join-Path $root 'release';$reportPath=Join-Path $root 'windows-validation-report.json'
          $report=Read-BoundedUtf8Text $reportPath 16777216|ConvertFrom-Json -Depth 50
          if([string]$report.status -ne 'passed'){throw 'Windows validation report is not passed.'}
          $receipts=@(Get-ChildItem -LiteralPath $release -Filter 'WinCare-*-release-receipt.json' -File -Force)
          if($receipts.Count -ne 1){throw 'Expected exactly one release receipt.'}
          $receipt=Read-BoundedUtf8Text $receipts[0].FullName 1048576|ConvertFrom-Json -Depth 50
          if([string]$receipt.schema -ne 'wincare.release.receipt/v3'){throw 'Release receipt schema v3 is required.'}
          $version=[string]$receipt.release
          if($version -ne '${{ steps.version.outputs.version }}'){throw "Resolved version ${{ steps.version.outputs.version }} does not match built version $version."}
          $expectedNames=@("WinCare-$version.zip","WinCare-$version.zip.sha256","WinCare-$version.zip.intoto.jsonl","WinCare-$version-SBOM.spdx.json","WinCare-$version-BUILD-RECEIPT.json","WinCare-$version-release-receipt.json","WinCare-$version-build-result.json","WinCare-$version-BRAND.json",'WinCare.exe','WinCare-GUI.exe','WinCare-TUI.exe','WinCare.Standalone.build.json')
          $actual=@(Get-ChildItem -LiteralPath $release -File -Force|Sort-Object Name)
          $missing=@($expectedNames|Where-Object{$_ -notin $actual.Name});$extra=@($actual.Name|Where-Object{$_ -notin $expectedNames})
          if($actual.Count -ne $expectedNames.Count -or $missing.Count -or $extra.Count){throw "Release asset closure mismatch: missing=$($missing -join ','); extra=$($extra -join ',')"}
          $files=foreach($entry in $actual){if($entry.Attributes -band [IO.FileAttributes]::ReparsePoint){throw "Release asset is a reparse point: $($entry.Name)"};[ordered]@{path='release/'+$entry.Name;sha256=(Get-FileHash -LiteralPath $entry.FullName -Algorithm SHA256).Hash.ToLowerInvariant();bytes=[long]$entry.Length}}
          $manifest=[ordered]@{schema='wincare.promotion-manifest/v2';sourceCommit=$env:SOURCE_COMMIT;workflowRunId=$env:WORKFLOW_RUN_ID;version=$version;tag='${{ steps.version.outputs.tag }}';validationReport=[ordered]@{path='windows-validation-report.json';sha256=(Get-FileHash -LiteralPath $reportPath -Algorithm SHA256).Hash.ToLowerInvariant();status='passed'};files=@($files)}
          $manifest|ConvertTo-Json -Depth 8|Set-Content (Join-Path $root 'promotion-manifest.json') -Encoding utf8NoBOM
          Write-Host '===== SEALED RELEASE ASSETS ====='
          $files|Format-Table path,bytes,sha256 -AutoSize
          Add-Content $env:GITHUB_STEP_SUMMARY "`nCandidate sealed as promotion manifest v2 for version **$version**, tag **${{ steps.version.outputs.tag }}**, commit ``$env:SOURCE_COMMIT``, with **$($files.Count)** exact assets.`n"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-care-validated-release-candidate
          path: |
            artifacts/windows-validation/release/**
            artifacts/windows-validation/windows-validation-report.json
            artifacts/windows-validation/promotion-manifest.json
            artifacts/windows-validation/workflow/**
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-production-validation-evidence
          path: artifacts/windows-validation/**
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Reverify, attest, and publish sealed bytes
    needs: build-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: win-care-validated-release-candidate
          path: candidate
      - name: Inventory downloaded candidate
        shell: pwsh
        run: |
          $files=@(Get-ChildItem -LiteralPath ./candidate -File -Recurse -Force|Sort-Object FullName|ForEach-Object{[ordered]@{path=[IO.Path]::GetRelativePath((Resolve-Path ./candidate).Path,$_.FullName).Replace('\','/');bytes=[long]$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}})
          Write-Host '===== DOWNLOADED CANDIDATE INVENTORY ====='
          $files|Format-Table path,bytes,sha256 -AutoSize
          Add-Content $env:GITHUB_STEP_SUMMARY "## Promotion candidate inventory`n`nDownloaded **$($files.Count)** files for independent re-verification.`n"
      - name: Verify sealed candidate
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ needs.build-validate.outputs.source_commit }}
          EXPECTED_TAG: ${{ needs.build-validate.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.build-validate.outputs.version }}
        run: |
          $ErrorActionPreference='Stop'
          function Read-BoundedUtf8Text{param([string]$LiteralPath,[int]$MaximumBytes)$item=Get-Item -LiteralPath $LiteralPath -Force -ErrorAction Stop;if($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or [long]$item.Length -gt $MaximumBytes){throw "Unsafe or oversized file: $LiteralPath"};$stream=[IO.FileStream]::new($item.FullName,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::None,4096,[IO.FileOptions]::SequentialScan);try{if($stream.Length -lt 1 -or $stream.Length -gt $MaximumBytes){throw "File length out of bounds: $LiteralPath"};$bytes=[byte[]]::new([int]$stream.Length);$offset=0;while($offset -lt $bytes.Length){$read=$stream.Read($bytes,$offset,$bytes.Length-$offset);if($read -le 0){throw "File ended unexpectedly: $LiteralPath"};$offset+=$read};try{$idx=0;$cnt=$bytes.Length;if($cnt -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF){$idx=3;$cnt-=3};[Text.UTF8Encoding]::new($false,$true).GetString($bytes,$idx,$cnt)}finally{[Array]::Clear($bytes,0,$bytes.Length)}}finally{$stream.Dispose()}}

          $tagRef=& gh api "repos/$env:GH_REPO/git/ref/tags/$env:EXPECTED_TAG"|ConvertFrom-Json -Depth 20
          if($LASTEXITCODE -ne 0){throw "Unable to resolve tag $env:EXPECTED_TAG."}
          $tagObjectType=[string]$tagRef.object.type
          $tagCommit=[string]$tagRef.object.sha
          if($tagObjectType -eq 'tag'){
            $annotatedTag=& gh api "repos/$env:GH_REPO/git/tags/$tagCommit"|ConvertFrom-Json -Depth 20
            if($LASTEXITCODE -ne 0){throw "Unable to resolve annotated tag object $tagCommit."}
            $tagObjectType=[string]$annotatedTag.object.type
            $tagCommit=[string]$annotatedTag.object.sha
          }
          if($tagObjectType -ne 'commit' -or $tagCommit -ne $env:EXPECTED_COMMIT){throw "Tag $env:EXPECTED_TAG resolves to $tagObjectType $tagCommit instead of commit $env:EXPECTED_COMMIT."}
          $root=[IO.Path]::GetFullPath('./candidate');$manifestPath=Join-Path $root 'promotion-manifest.json';$reportPath=Join-Path $root 'windows-validation-report.json'
          $manifest=Read-BoundedUtf8Text $manifestPath 1048576|ConvertFrom-Json -Depth 20
          if([string]$manifest.schema -ne 'wincare.promotion-manifest/v2'){throw 'Unsupported promotion manifest.'}
          if([string]$manifest.sourceCommit -ne $env:EXPECTED_COMMIT){throw 'Promotion source commit mismatch.'}
          if([string]$manifest.tag -ne $env:EXPECTED_TAG -or [string]$manifest.version -ne $env:EXPECTED_VERSION){throw 'Promotion release identity mismatch.'}
          if([string]$manifest.validationReport.status -ne 'passed'){throw 'Promotion validation status is not passed.'}
          if((Get-FileHash -LiteralPath $reportPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$manifest.validationReport.sha256){throw 'Validation report hash mismatch.'}
          $release=Join-Path $root 'release';$records=@($manifest.files)
          if($records.Count -ne 12){throw 'Promotion manifest must contain exactly twelve release assets.'}
          $expected=[Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach($record in $records){$relative=[string]$record.path;if($relative -notmatch '^release/[A-Za-z0-9][A-Za-z0-9._+-]*$' -or -not $expected.Add($relative)){throw "Unsafe or duplicate promotion path: $relative"};$path=Join-Path $root $relative;$item=Get-Item -LiteralPath $path -Force -ErrorAction Stop;if($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)){throw "Unsafe promotion asset: $relative"};if([long]$item.Length -ne [long]$record.bytes){throw "Promotion size mismatch: $relative"};if((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$record.sha256){throw "Promotion hash mismatch: $relative"}}
          $actual=@(Get-ChildItem -LiteralPath $release -File -Force|ForEach-Object{'release/'+$_.Name})
          if(@($actual|Where-Object{-not $expected.Contains($_)}).Count -or @($expected|Where-Object{$_ -notin $actual}).Count){throw 'Promotion asset membership mismatch.'}
          "release_dir=$release"|Out-File $env:GITHUB_OUTPUT -Append
          "manifest_path=$manifestPath"|Out-File $env:GITHUB_OUTPUT -Append
          "report_path=$reportPath"|Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Promotion verification passed for version $env:EXPECTED_VERSION and $($records.Count) exact assets."
          Add-Content $env:GITHUB_STEP_SUMMARY "Promotion verification passed for version **$env:EXPECTED_VERSION**, tag **$env:EXPECTED_TAG**, commit ``$env:EXPECTED_COMMIT``, and **$($records.Count)** exact assets.`n"
      - name: Inspect publication state
        id: publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-validate.outputs.tag }}
        run: |
          $ErrorActionPreference='Stop'
          $tag=$env:RELEASE_TAG
          $headers=@{
            Accept='application/vnd.github+json'
            Authorization="Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='WinCare-release-workflow'
          }
          $encodedTag=[Uri]::EscapeDataString($tag)
          $uri="https://api.github.com/repos/$env:GH_REPO/releases/tags/$encodedTag"
          $response=Invoke-WebRequest -Method Get -Uri $uri -Headers $headers -SkipHttpErrorCheck
          $statusCode=[int]$response.StatusCode
          if($statusCode -eq 200){
            $release=$response.Content|ConvertFrom-Json -Depth 20
            if([string]$release.tag_name -ne $tag){throw "Release lookup returned tag $($release.tag_name) instead of $tag."}
            "exists=true"|Out-File $env:GITHUB_OUTPUT -Append
            Add-Content $env:GITHUB_STEP_SUMMARY "Release **$tag** already exists. Its immutable product bytes will be independently compared with this candidate.`n"
          }elseif($statusCode -eq 404){
            "exists=false"|Out-File $env:GITHUB_OUTPUT -Append
          }else{
            $body=([string]$response.Content).Trim()
            if($body.Length -gt 2048){$body=$body.Substring(0,2048)}
            throw "Unable to determine publication state for $tag`: GitHub API returned HTTP $statusCode. $body"
          }
      - name: Attest all exact release assets
        if: steps.publication.outputs.exists != 'true'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.verify.outputs.release_dir }}/*
      - name: Publish exact validated assets
        id: publish
        if: steps.publication.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-validate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build-validate.outputs.source_commit }}
        run: |
          $ErrorActionPreference='Stop'
          $releaseDirectory='${{ steps.verify.outputs.release_dir }}'
          $candidateRoot=Split-Path -Parent $releaseDirectory
          $assets=@(
            Get-ChildItem -LiteralPath $releaseDirectory -File -Force|Sort-Object Name|ForEach-Object FullName
            Join-Path $candidateRoot 'windows-validation-report.json'
            Join-Path $candidateRoot 'promotion-manifest.json'
          )
          if($assets.Count -ne 14){throw "Expected fourteen publication files, found $($assets.Count)."}
          $tag=$env:RELEASE_TAG
          Write-Host "Publishing tag=$tag version=$env:RELEASE_VERSION sourceCommit=$env:SOURCE_COMMIT assetCount=$($assets.Count)"
          foreach($asset in $assets){$item=Get-Item -LiteralPath $asset -Force;Write-Host "asset=$($item.Name) bytes=$($item.Length) sha256=$((Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"}
          $arguments=@('release','create',$tag)+$assets+@('--title',"WinCare v$env:RELEASE_VERSION",'--notes','Exact-byte Windows-validated standalone release with v3 receipts, SBOM, checksums, native provenance, lifecycle evidence, diagnostic indexes, and attestations.')
          if($env:WINCARE_EVENT_NAME -eq 'push'){$arguments+='--verify-tag'}else{$arguments+=@('--target',$env:SOURCE_COMMIT)}
          & gh @arguments
          if($LASTEXITCODE -ne 0){throw "GitHub release creation failed with exit code $LASTEXITCODE."}
          Add-Content $env:GITHUB_STEP_SUMMARY "Published **$env:RELEASE_TAG** with **$($assets.Count)** pre-validated files. No bytes were rebuilt in the promotion job.`n"
      - name: Verify published or pre-existing immutable release
        if: always() && (steps.publication.outputs.exists == 'true' || steps.publish.outcome == 'success')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-validate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build-validate.outputs.source_commit }}
        run: |
          $ErrorActionPreference='Stop'
          function Read-BoundedUtf8Text{param([string]$LiteralPath,[int]$MaximumBytes)$item=Get-Item -LiteralPath $LiteralPath -Force -ErrorAction Stop;if($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or [long]$item.Length -gt $MaximumBytes){throw "Unsafe or oversized file: $LiteralPath"};$stream=[IO.FileStream]::new($item.FullName,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::None,4096,[IO.FileOptions]::SequentialScan);try{if($stream.Length -lt 1 -or $stream.Length -gt $MaximumBytes){throw "File length out of bounds: $LiteralPath"};$bytes=[byte[]]::new([int]$stream.Length);$offset=0;while($offset -lt $bytes.Length){$read=$stream.Read($bytes,$offset,$bytes.Length-$offset);if($read -le 0){throw "File ended unexpectedly: $LiteralPath"};$offset+=$read};try{$idx=0;$cnt=$bytes.Length;if($cnt -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF){$idx=3;$cnt-=3};[Text.UTF8Encoding]::new($false,$true).GetString($bytes,$idx,$cnt)}finally{[Array]::Clear($bytes,0,$bytes.Length)}}finally{$stream.Dispose()}}

          $published=[IO.Path]::GetFullPath('./published-release')
          New-Item -ItemType Directory -Path $published -Force|Out-Null
          & gh release download $env:RELEASE_TAG --dir $published
          if($LASTEXITCODE -ne 0){throw "Failed to download published release $env:RELEASE_TAG."}
          $allPublished=@(Get-ChildItem -LiteralPath $published -File -Force)
          if($allPublished.Count -ne 14){throw "Published release must contain exactly fourteen files; found $($allPublished.Count)."}
          $publishedManifestPath=Join-Path $published 'promotion-manifest.json'
          $publishedReportPath=Join-Path $published 'windows-validation-report.json'
          $publishedManifest=Read-BoundedUtf8Text $publishedManifestPath 1048576|ConvertFrom-Json -Depth 20
          if([string]$publishedManifest.schema -ne 'wincare.promotion-manifest/v2'){throw 'Published promotion manifest schema mismatch.'}
          if([string]$publishedManifest.sourceCommit -ne $env:SOURCE_COMMIT -or [string]$publishedManifest.version -ne $env:RELEASE_VERSION){throw 'Published release identity mismatch.'}
          if($publishedManifest.PSObject.Properties.Name -contains 'tag' -and [string]$publishedManifest.tag -ne $env:RELEASE_TAG){throw 'Published release tag mismatch.'}
          if((Get-FileHash -LiteralPath $publishedReportPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$publishedManifest.validationReport.sha256){throw 'Published validation report hash mismatch.'}
          $candidateRelease='${{ steps.verify.outputs.release_dir }}'
          $records=@($publishedManifest.files)
          if($records.Count -ne 12){throw 'Published promotion manifest must contain exactly twelve release assets.'}
          foreach($record in $records){
            $name=[IO.Path]::GetFileName([string]$record.path)
            $candidatePath=Join-Path $candidateRelease $name
            $publishedPath=Join-Path $published $name
            foreach($path in @($candidatePath,$publishedPath)){if(-not(Test-Path -LiteralPath $path -PathType Leaf)){throw "Missing release asset: $path"}}
            $candidateHash=(Get-FileHash -LiteralPath $candidatePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $publishedHash=(Get-FileHash -LiteralPath $publishedPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if($candidateHash -ne [string]$record.sha256 -or $publishedHash -ne [string]$record.sha256){throw "Immutable release byte mismatch: $name"}
            if((Get-Item -LiteralPath $candidatePath).Length -ne [long]$record.bytes -or (Get-Item -LiteralPath $publishedPath).Length -ne [long]$record.bytes){throw "Immutable release size mismatch: $name"}
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "Re-downloaded and verified **$env:RELEASE_TAG**: 12 immutable product assets match the sealed candidate and published promotion manifest exactly.`n"
