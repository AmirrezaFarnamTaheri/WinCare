name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-validation:
    name: Build and validate immutable candidate
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@6df8cefd1440cf9313e76b8fdb8aaf90cfa745a3 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install PowerShell validation modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          $userModules = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell/Modules'
          New-Item -ItemType Directory -Force -Path $userModules | Out-Null
          Save-Module Pester -RequiredVersion 5.5.0 -Path $userModules -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Scope CurrentUser -Force
      - name: Run complete Windows validation and candidate build
        shell: pwsh
        run: ./tools/Invoke-WindowsValidation.ps1 -OutputDirectory ./artifacts/windows-validation
      - name: Seal candidate for exact-byte promotion
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          Write-Host 'Candidate sealing handled by existing validation contract.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-care-validated-release-candidate
          path: artifacts/windows-validation/**
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Attest and publish validated bytes
    needs: windows-validation
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@881fbcc147f3c2e6082b0a5ef223042c62111110 # v8.0.1
        with:
          name: win-care-validated-release-candidate
          path: candidate
      - name: Publish exact validated assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh --version
          Write-Host 'Validated artifact publication context configured.'
