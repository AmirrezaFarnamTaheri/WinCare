name: Native Release Finalization

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version label (must match checked-in product version)
        required: true
        default: 2.5.0-rc5
        type: string
      mode:
        description: Finalization gate
        required: true
        default: rc
        type: choice
        options:
          - rc
          - production

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WINCARE_VERSION: ${{ inputs.version }}
      WINCARE_MODE: ${{ inputs.mode }}
    steps:
      - name: Require primary branch dispatch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Error: manual release publication must be dispatched from master/main; got '$GITHUB_REF'."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate version matches product metadata
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          props = ET.parse("Directory.Build.props").getroot()
          prefix = props.find(".//VersionPrefix").text
          suffix_node = props.find(".//VersionSuffix")
          suffix = suffix_node.text if suffix_node is not None else ""
          expected = f"{prefix}-{suffix}" if suffix else prefix
          actual = os.environ["WINCARE_VERSION"].removeprefix("v")
          assert actual == expected, f"Input version {actual} does not match product version {expected}"
          PY
      - name: Verify native source contract
        run: python tools/verify_native_foundation.py
      - name: Run native structural tests
        run: python -m unittest discover -s tests/native -v
      - name: Finalize release-candidate source artifacts
        if: inputs.mode == 'rc'
        shell: bash
        run: >-
          python tools/finalize_native_release.py
          --output artifacts/finalization
          --version "$WINCARE_VERSION"
          --mode rc
      - name: Enforce production parity and finalize source artifacts
        if: inputs.mode == 'production'
        shell: bash
        run: >-
          python tools/finalize_native_release.py
          --output artifacts/finalization
          --version "$WINCARE_VERSION"
          --mode production
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WinCare-${{ inputs.version }}-${{ inputs.mode }}-finalization
          path: artifacts/finalization/*
          if-no-files-found: error
      - name: Hold artifacts for manual publication
        run: echo "Validation completed. Download the artifact and publish it manually after review."
