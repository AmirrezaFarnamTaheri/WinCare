name: Apply WinCare closure canonicalization

on:
  push:
    branches:
      - agent/documentation-overhaul

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'wincare-audit-bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Detect complete migration source
        id: source
        shell: bash
        run: |
          present=true
          for part in 00 01 02 03 04 05; do
            [[ -f ".wincare-closure/script-${part}" ]] || present=false
          done
          echo "present=${present}" >> "$GITHUB_OUTPUT"

      - name: Canonicalize, validate, and commit
        if: steps.source.outputs.present == 'true'
        shell: bash
        env:
          EXPECTED_SCRIPT_SHA256: fc8d3f692f8eb2eadaefcc69f044d6e56263d660fd5aa28603a3b7e27acb58df
        run: |
          set -euo pipefail
          cat .wincare-closure/script-* > /tmp/canonicalize_closures.py
          echo "$EXPECTED_SCRIPT_SHA256  /tmp/canonicalize_closures.py" | sha256sum --check --strict
          python -m py_compile /tmp/canonicalize_closures.py
          python /tmp/canonicalize_closures.py
          python tools/validate_source_references.py . --write
          rm -rf .wincare-closure
          rm -f .github/workflows/apply-closure-canonicalization.yml
          git add -A
          git diff --cached --check

          validators=(
            validate_source.py
            validate_module_manifest.py
            validate_action_bindings.py
            validate_powershell_calls.py
            validate_test_source_assertions.py
            validate_source_references.py
            audit_stub_inventory.py
            validate_maintainability.py
            validate_network_egress.py
            validate_external_processes.py
            validate_bounded_io.py
            validate_read_only_state.py
            validate_context_menu_catalog.py
            validate_test_fixtures.py
            validate_gui.py
          )
          for validator in "${validators[@]}"; do
            python "tools/$validator" .
          done
          python -m unittest discover -s tools -p 'test_*.py' -v

          git config user.name 'wincare-audit-bot'
          git config user.email 'wincare-audit-bot@users.noreply.github.com'
          git commit -m 'refactor: canonicalize closure implementations'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Await complete migration source
        if: steps.source.outputs.present != 'true'
        shell: bash
        run: echo 'The complete audited migration source has not been staged yet.'
