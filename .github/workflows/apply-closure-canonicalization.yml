name: Apply WinCare closure canonicalization

on:
  push:
    branches:
      - agent/documentation-overhaul

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Detect audited payload
        id: payload
        shell: bash
        run: |
          if [[ -f .wincare-closure/closure.patch.xz.b64 ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply, validate, and commit closure canonicalization
        if: steps.payload.outputs.present == 'true'
        shell: bash
        env:
          EXPECTED_XZ_SHA256: 6f6d7490ae1365581ca7ad0279deb326c35e432e95c6bda87bcba291582740fd
          EXPECTED_PATCH_SHA256: 659173ec3373290dd7aaec8c09888f77f5757a4a0f0ec5928f65df6530461b2e
        run: |
          set -euo pipefail
          base64 --decode .wincare-closure/closure.patch.xz.b64 > /tmp/closure.patch.xz
          echo "$EXPECTED_XZ_SHA256  /tmp/closure.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/closure.patch.xz > /tmp/closure.patch
          echo "$EXPECTED_PATCH_SHA256  /tmp/closure.patch" | sha256sum --check --strict
          git apply --check /tmp/closure.patch
          git apply --index /tmp/closure.patch
          rm -rf .wincare-closure
          rm -f .github/workflows/apply-closure-canonicalization.yml
          git add -A
          git diff --cached --check

          validators=(
            validate_source.py
            validate_module_manifest.py
            validate_action_bindings.py
            validate_powershell_calls.py
            validate_test_source_assertions.py
            validate_source_references.py
            audit_stub_inventory.py
            validate_maintainability.py
            validate_network_egress.py
            validate_external_processes.py
            validate_bounded_io.py
            validate_read_only_state.py
            validate_context_menu_catalog.py
            validate_test_fixtures.py
            validate_gui.py
          )
          for validator in "${validators[@]}"; do
            python "tools/$validator" .
          done
          python -m unittest discover -s tools -p 'test_*.py' -v

          git config user.name 'wincare-audit-bot'
          git config user.email 'wincare-audit-bot@users.noreply.github.com'
          git commit -m 'refactor: canonicalize closure implementations'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Await payload
        if: steps.payload.outputs.present != 'true'
        shell: bash
        run: echo 'The audited closure payload has not been staged yet.'
