best:
  iteration: 1
  metric_value: 4803.0
  description: "h01 receipt cache — skips validation loop on warm loads, saves ~105ms"

experiments:
  - id: h01
    iteration: 1
    hypothesis: "Cache validation receipt, skip 72 Test-Path on clean boots"
    category: manifest-pruning
    timestamp: "2026-08-01T19:30:43Z"
    metrics:
      load_time_ms_median: 4803.0
      load_time_ms_min: 4191.7
      load_time_ms_max: 4803.0
      cold_ms_median: 4908.1
      load_succeeded: true
    delta_vs_baseline_ms: -158.5
    delta_pct: -3.2
    verdict: KEEP
    notes: >
      Actual save (~105ms warm vs cold) is far below the 800-1500ms estimate.
      Root cause: the validation loop (Import-PowerShellDataFile x3 + Get-ChildItem)
      is only ~100ms. The bottleneck is the 172 sequential dot-source calls (~4700ms).
      Keeping h01 as a free correctness win for users who reinstall frequently.
      Receipt cache adds zero overhead on warm loads. Pivoting to h05 (file merge).

hypothesis_backlog:
  # High priority — expected biggest wins
  - id: h01
    description: >
      Skip the per-boot source manifest validation (72 Test-Path + psd1 import
      calls) when a cached validation receipt exists. Emit warning if receipt is
      stale. Expected save: ~800-1500ms.
    category: manifest-pruning
    priority: high
    dep_status: approved
    required_deps: []

  - id: h02
    description: >
      Dot-source only Core group files at import time; lazy-load Providers and
      UI groups on first call using a module-scope ScriptBlock cache. Requires
      wrapping provider functions in a stub that triggers the lazy load.
      Expected save: ~2000-3000ms (80 Providers + 56 UI files skipped at init).
    category: load-ordering
    priority: high
    dep_status: approved
    required_deps: []

  - id: h03
    description: >
      Remove the $ExecutionContext.SessionState.Module.Version call (which does
      an expensive module manifest re-read) and derive version from a pre-baked
      $script:WinCareVersion constant injected at build time. Would require CI
      change. Expected save: ~50-200ms.
    category: manifest-pruning
    priority: low
    dep_status: approved
    required_deps: []

  - id: h04
    description: >
      Use Runspace pool to dot-source the three source groups in parallel
      (Core / Providers / UI each in a separate Runspace, then merge into
      module scope). Technically complex and may conflict with module scope.
      Expected save: ~1500-2500ms if groups are truly independent.
    category: parallel-dot-source
    priority: medium
    dep_status: needs_approval
    required_deps: ["RunspacePool-module-scope-merge (novel PS technique, unverified)"]

  - id: h05
    description: >
      Consolidate the 172 source files into 3 merged .ps1 group files at build
      time (Core.merged.ps1, Providers.merged.ps1, UI.merged.ps1). Eliminate
      per-file dot-source overhead (172 file-open operations → 3).
      Expected save: ~1000-2000ms. Requires build step in CI.
    category: psm-caching
    priority: high
    dep_status: needs_approval
    required_deps: ["CI build step to merge source files"]

strategy_digest: |
  ## Strategy Digest — Iteration 0 (Baseline only)

  ### What we know
  - Module load is ~4,962ms median (3 warm runs, isolated jobs)
  - All 172 source files are dot-sourced sequentially via the source manifest loop
  - 72 Test-Path calls + 3 psd1 Import-PowerShellDataFile calls happen on every load
  - The validation loop (lines 26-60 of psm1) runs EVERY import even in production

  ### Hypothesis priority order
  1. h01 (manifest-pruning): Skip boot-time validation — highest safety/reward ratio
  2. h05 (file merge at build): Eliminates 172 file-open syscalls — big win but needs CI change
  3. h02 (lazy-load Providers+UI): Largest potential saving but most invasive
  4. h04 (parallel Runspace): Uncertain PowerShell module-scope semantics, risky

  ### Constraint
  The source manifest validation IS a security/integrity gate (detects file tampering).
  Any optimization of this path must preserve the validation — it cannot be skipped
  unconditionally, only cached behind a receipt file.
