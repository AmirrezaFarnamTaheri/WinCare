[workspace]
members = ["wincare-core", "wincare-guard"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
# Minimum supported Rust version (MSRV) for the workspace. It is intentionally the
# minimum toolchain that can compile edition-2024 code; the pinned build toolchain in
# `rust-toolchain.toml` (1.97.1) is the exact compiler CI and releases use, and may be
# newer than the MSRV.
rust-version = "1.85"

[workspace.dependencies]
sha2 = "0.11.0"
tempfile = "3.20.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# The core is loaded in-process by the WinCare host and its C ABI wraps every entry point in
# catch_unwind to convert an unexpected panic into an InternalError status. Unwinding is what
# makes that recovery possible: with panic = "abort" catch_unwind cannot intercept anything and
# the first panic terminates the host process alongside the library. Reserve abort for
# standalone binaries that own their own process.
panic = "unwind"
strip = true
